k trace. The alert says what it costs and what to do now."},{"title":"Impact differs by stage, so the message does","why":"Intake failing can lose a scan; enrichment failing only thins the card; a 03 failure means nobody was told about a lead. Each stage has its own line."},{"title":"Key on the stage number, not the name","why":"The stage is parsed from the name after 'GTM', so renames cannot break the mapping. An unknown stage still alerts with a generic line and the execution link."},{"title":"Retries and soft-fails live on the watched workflows","why":"Most external calls in 01 to 06 retry and continue on error with a recorded warning, so the lead still flows. 99 is for what escapes them."},{"title":"The alert itself must not fail silently","why":"Report to RevOps retries three times and has no continue-on-error, so a Slack failure fails 99's execution and stays visible."}],"questions":[{"q":"How does a workflow failure reach Slack?","a":"Each Oak workflow sets settings.errorWorkflow to 99 (N4JW7CO6qjdLi6mq). n8n runs 99's Error Trigger with the workflow name, failed node, error and execution URL; Explain the Failure maps it to a stage, an impact line and a likely cause; Report to RevOps posts it to #oak-revops with a link to the execution."},{"q":"Why not just forward the error message?","a":"The person reading at an event needs what it costs and what to do. The stage line answers that, for example that a 03 failure means HubSpot is right but nobody was notified, so someone should tell the booth manually and treat it as urgent."},{"q":"What if the failure handler itself fails?","a":"The Slack node retries three times and then fails the execution, so it shows as an error in the execution list. n8n does not run an error workflow for its own error workflow, to avoid a loop, so the '99' impact line is defensive."},{"q":"Why is there a 07 entry if 07 is a manual test harness?","a":"Error workflows fire only for production executions and 07 is run by hand, so today it never fires. It stays mapped so a rename, or 07 gaining a real trigger, cannot quietly produce a generic alert."},{"q":"Where do soft-fails end and alerts begin?","a":"HubSpot, Brave, Gemini and most Slack calls retry and continue on error, recording warnings on the payload so the lead still flows. 99 only sees unhandled exceptions and nodes deliberately left hard-failing, such as 06's thread replies and claim card update, and its own Slack post."},{"q":"Does 99 read the channel from the policy?","a":"No. The policy declares notifications.ops_alerts as oak-revops and the node posts to oak-revops, so they match, but the name is typed into the node. Changing ops_alerts in the table would not move failure alerts; making 99 read it would be a small change."}]}];
</script>
<script>
(function () {
  "use strict";

  var GUIDE = Array.isArray(window.GUIDE) ? window.GUIDE : [];
  var ORDER = ["00", "01", "02", "02A", "03", "04", "05", "06", "07", "08", "99"];
  var LANES = [
    { key: "intake", label: "Intake" },
    { key: "enrich", label: "Enrich and reason" },
    { key: "write", label: "Write and notify" },
    { key: "rep", label: "Rep actions" },
    { key: "ops", label: "Operations" }
  ];
  var LANE_LABEL = {};
  LANES.forEach(function (l) { LANE_LABEL[l.key] = l.label; });

  // Fixed facts about the system, used for the map and for workflows whose notes are not built yet.
  var META = {
    "01": { short: "Intake & Decision", lane: "intake", blurb: "The booth webhook. Validates, blocks replays, classifies by policy, answers in about 2 seconds, then runs the rest of the pipeline." },
    "02A": { short: "CRM Context", lane: "enrich", blurb: "Reads HubSpot, read-only, so the decision knows the relationship, owner and open deals." },
    "04": { short: "Company & Person Enrichment", lane: "enrich", blurb: "Free homepage read always; paid Brave search gated off for out of scope; person search skipped for competitors." },
    "05": { short: "AI Lead Reasoning", lane: "enrich", blurb: "Bounded Gemini synthesis: resolves an ambiguous title above a 0.7 floor, an unknown industry, and writes the opening question and listen-fors." },
    "02": { short: "HubSpot Sync", lane: "write", blurb: "Writes the contact, company, meeting and note to HubSpot. Human-typed values win via keep()." },
    "03": { short: "Slack Alerts", lane: "write", blurb: "Builds the Slack card, picks the channel from the policy, threads repeat visitors, attaches the buttons each tier gets." },
    "06": { short: "Slack Actions", lane: "rep", blurb: "Handles the twelve rep buttons. Reclassification reloads raw_json and calls 03 to repost the card." },
    "00": { short: "Setup & Seed", lane: "ops", blurb: "Creates and seeds the Data Tables. Runs from its draft by hand and is never published." },
    "07": { short: "Task Test Harness", lane: "ops", blurb: "Replays test payloads through the live booth webhook and scores each one PASS or FAIL." },
    "08": { short: "Control Center API", lane: "ops", blurb: "Serves the control-center app from static webhook routes under oak-api." },
    "99": { short: "Failure Handler", lane: "ops", blurb: "Error workflow for eight workflows. Turns a failure into a plain-language Slack report in #oak-revops." }
  };
  var EXT = {
    scanner: { label: ["Booth scanner", "POST /scan"] },
    slack: { label: ["Slack buttons"] },
    app: { label: ["Control Center", "app"] }
  };
  // Real call edges. n = order in which 01 calls its sub-flows.
  var EDGES = [
    { from: "scanner", to: "01", kind: "ext", inText: "the booth scanner (POST /oak-event/scan)" },
    { from: "07", to: "01", kind: "ext", inText: "07, which replays test scans", outText: "01's booth webhook from outside, with test payloads" },
    { from: "01", to: "02A", kind: "call", n: 1 },
    { from: "01", to: "04", kind: "call", n: 2 },
    { from: "01", to: "05", kind: "call", n: 3 },
    { from: "01", to: "02", kind: "call", n: 4 },
    { from: "01", to: "03", kind: "call", n: 5 },
    { from: "slack", to: "06", kind: "ext", inText: "rep button clicks in Slack" },
    { from: "06", to: "03", kind: "call", outText: "03, to repost the card on reclassification" },
    { from: "08", to: "app", kind: "serve", outText: "the Control Center app" }
  ];
  var FAILS = ["01", "02", "02A", "03", "04", "05", "06", "07"];

  var byId = {};
  GUIDE.forEach(function (w) { byId[String(w.id).toUpperCase()] = w; });
  // Add any extra sub-flow calls the data declares that the fixed list lacks.
  GUIDE.forEach(function (w) {
    var from = String(w.id).toUpperCase();
    (w.calls || []).forEach(function (c) {
      var id = idIn(c);
      if (!id || id === from) return;
      var dup = EDGES.some(function (e) { return e.from === from && e.to === id; });
      if (!dup) EDGES.push({ from: from, to: id, kind: "call", extra: true });
    });
  });

  function idIn(s) {
    var m = /^\s*(02A|0\d|99)\b/i.exec(String(s || ""));
    if (!m) return null;
    var id = m[1].toUpperCase();
    return ORDER.indexOf(id) >= 0 ? id : null;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function tok(id) { return "wf-" + id.toLowerCase(); }
  function nodeTok(id, step) { return tok(id) + "-n" + step; }
  function parseTok(h) {
    var m = /^wf-(\d\d)(a)?(?:-n(\d+))?$/i.exec(h || "");
    if (!m) return null;
    var id = (m[1] + (m[2] ? "A" : "")).toUpperCase();
    if (ORDER.indexOf(id) < 0) return null;
    return { id: id, step: m[3] ? +m[3] : null };
  }
  function shortOf(id) { return (byId[id] && byId[id].short) || META[id].short; }
  function laneOf(id) { return META[id].lane; }
  function firstSentence(s) {
    var m = /^[\s\S]*?[.!?](\s|$)/.exec(s || "");
    return (m ? m[0] : s || "").trim();
  }
  function nodesOf(w) {
    var out = [];
    groupsOf(w).forEach(function (g) { g.nodes.forEach(function (n) { out.push(n); }); });
    return out;
  }
  function groupsOf(w) {
    var gs = (w.groups || []).map(function (g) {
      var ns = (g.nodes || []).slice().sort(function (a, b) { return a.step - b.step; });
      return { name: g.name, purpose: g.purpose, nodes: ns, min: ns.length ? ns[0].step : 1e9 };
    });
    return gs.sort(function (a, b) { return a.min - b.min; });
  }
  function edgeName(k) { return EXT[k] ? EXT[k].label.join(" ") : k; }

  /* ---------- storage (per-viewer convenience only) ---------- */
  var KEY = "oak-field-guide:v1";
  var state = { last: null, scroll: {}, talk: false };
  try {
    var raw = window.localStorage.getItem(KEY);
    if (raw) {
      var got = JSON.parse(raw);
      if (got && typeof got === "object") {
        state.last = typeof got.last === "string" ? got.last : null;
        state.scroll = got.scroll && typeof got.scroll === "object" ? got.scroll : {};
        state.talk = !!got.talk;
      }
    }
  } catch (e) { /* storage blocked: defaults */ }
  var saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { window.localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
    }, 200);
  }

  var main = document.getElementById("main");
  var side = document.getElementById("side");
  var shell = document.getElementById("shell");
  var pick = document.getElementById("wf-pick");
  var talkBtn = document.getElementById("talk");
  var root = document.documentElement;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- picker ---------- */
  (function buildPick() {
    var html = '<option value="map">System map</option>';
    LANES.forEach(function (l) {
      html += '<optgroup label="' + esc(l.label) + '">';
      ORDER.filter(function (id) { return laneOf(id) === l.key; }).forEach(function (id) {
        html += '<option value="' + tok(id) + '">' + esc(id + "  " + shortOf(id)) + (byId[id] ? "" : " (not written)") + "</option>";
      });
      html += "</optgroup>";
    });
    pick.innerHTML = html;
    pick.addEventListener("change", function () { go(pick.value); });
  })();

  /* ---------- map ---------- */
  var ROWY = { intake: 60, enrich: 164, write: 268, rep: 372, ops: 476 };
  var POS = {
    "01": [440, "intake"], "02A": [600, "enrich"], "04": [770, "enrich"], "05": [940, "enrich"],
    "02": [360, "write"], "03": [520, "write"], "06": [520, "rep"],
    "07": [260, "ops"], "99": [440, "ops"], "00": [610, "ops"], "08": [780, "ops"]
  };
  var EPOS = { scanner: [260, "intake", 120], slack: [330, "rep", 120], app: [950, "ops", 110] };
  var NW = 156, NH = 60;
  // Hand-routed so no edge crosses a box.
  var ROUTES = {
    "scanner>01": "M320,60 L358,60",
    "07>01": "M260,446 L260,132 C260,108 400,118 400,94",
    "01>02A": "M518,50 C600,50 600,92 600,130",
    "01>04": "M518,60 C770,60 770,92 770,130",
    "01>05": "M518,70 C940,70 940,92 940,130",
    "01>02": "M410,90 C410,170 360,170 360,234",
    "01>03": "M470,90 C470,170 520,170 520,234",
    "slack>06": "M390,372 L438,372",
    "06>03": "M520,342 L520,302",
    "08>app": "M858,476 L891,476"
  };
  var BADGE = { "01>02A": [600, 108], "01>04": [770, 108], "01>05": [940, 108], "01>02": [364, 206], "01>03": [516, 206] };
  var LABELS = {
    "07>01": [270, 424, "start", "replays test scans"],
    "slack>06": [414, 360, "middle", "clicks"],
    "06>03": [532, 326, "start", "calls 03 on reclassify"],
    "08>app": [874, 500, "middle", "serves"]
  };
  function wrapName(s, max) {
    var words = String(s).split(/\s+/), lines = [""];
    words.forEach(function (w) {
      var cur = lines[lines.length - 1];
      if (cur && (cur + " " + w).length > max && lines.length < 2) lines.push(w);
      else lines[lines.length - 1] = cur ? cur + " " + w : w;
    });
    return lines;
  }
  function centerOf(k) {
    if (POS[k]) return [POS[k][0], ROWY[POS[k][1]]];
    if (EPOS[k]) return [EPOS[k][0], ROWY[EPOS[k][1]]];
    return null;
  }
  function mapSVG() {
    var s = '<svg id="map-svg" viewBox="0 0 1040 536" role="img" aria-label="System map: ten workflows in five lanes with their call edges">';
    s += '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahead" d="M0,0 L10,5 L0,10 z"/></marker></defs>';
    LANES.forEach(function (l, i) {
      var y = ROWY[l.key] - 52;
      if (i % 2 === 0) s += '<rect class="band" x="0" y="' + y + '" width="1040" height="104" rx="4"/>';
      s += '<g data-lane="' + l.key + '"><rect x="14" y="' + (y + 14) + '" width="9" height="9" rx="2" style="fill:var(--lane)"/>';
      s += '<text class="lane-t" x="30" y="' + (y + 22.5) + '">' + esc(l.label) + "</text></g>";
    });
    // edges first so boxes sit on top
    EDGES.forEach(function (e) {
      var key = e.from + ">" + e.to;
      var d = ROUTES[key];
      if (!d) {
        var a = centerOf(e.from), b = centerOf(e.to);
        if (!a || !b) return;
        d = "M" + a[0] + "," + (a[1] + NH / 2) + " L" + b[0] + "," + (b[1] - NH / 2 - 2);
      }
      var cls = "edge" + (e.kind === "ext" || e.kind === "serve" ? " ext" : "");
      s += '<path class="' + cls + '" data-e="' + esc(key) + '" d="' + d + '" marker-end="url(#ah)"/>';
    });
    EDGES.forEach(function (e) {
      var key = e.from + ">" + e.to;
      if (e.n && BADGE[key]) {
        var p = BADGE[key];
        s += '<g class="ebadge" data-e="' + esc(key) + '"><circle cx="' + p[0] + '" cy="' + p[1] + '" r="9"/><text x="' + p[0] + '" y="' + (p[1] + 4) + '">' + e.n + "</text></g>";
      }
      if (LABELS[key]) {
        var L = LABELS[key];
        s += '<text class="elabel" data-e="' + esc(key) + '" x="' + L[0] + '" y="' + L[1] + '" text-anchor="' + L[2] + '">' + esc(L[3]) + "</text>";
      }
    });
    Object.keys(EPOS).forEach(function (k) {
      var p = EPOS[k], cx = p[0], cy = ROWY[p[1]], w = p[2], lines = EXT[k].label, h = lines.length > 1 ? 40 : 34;
      s += '<g class="ext"><rect class="ebox" x="' + (cx - w / 2) + '" y="' + (cy - h / 2) + '" width="' + w + '" height="' + h + '" rx="' + h / 2 + '"/>';
      lines.forEach(function (ln, i) {
        s += '<text x="' + cx + '" y="' + (cy + 4 + (i - (lines.length - 1) / 2) * 14) + '">' + esc(ln) + "</text>";
      });
      s += "</g>";
    });
    ORDER.forEach(function (id) {
      var p = POS[id], cx = p[0], cy = ROWY[p[1]], x = cx - NW / 2, y = cy - NH / 2;
      var w = byId[id];
      var lines = wrapName(shortOf(id), 21);
      s += '<g class="mnode' + (w ? "" : " missing") + '" data-lane="' + laneOf(id) + '" data-id="' + id + '" data-go="' + tok(id) + '" tabindex="0" role="link" aria-label="Open ' + esc(id + " " + shortOf(id)) + '">';
      s += '<rect class="mbox" x="' + x + '" y="' + y + '" width="' + NW + '" height="' + NH + '" rx="6"/>';
      s += '<text class="mid" x="' + (x + 12) + '" y="' + (y + 20) + '" style="fill:var(--lane)">' + id + "</text>";
      s += '<text class="mcount" x="' + (x + NW - 12) + '" y="' + (y + 20) + '">' + (w ? w.node_count + " nodes" : "not written") + "</text>";
      lines.forEach(function (ln, i) {
        s += '<text class="mname" x="' + (x + 12) + '" y="' + (y + (lines.length > 1 ? 38 : 42) + i * 15) + '">' + esc(ln) + "</text>";
      });
      if (FAILS.indexOf(id) >= 0) s += '<circle class="faildot" cx="' + (x + NW - 12) + '" cy="' + y + '" r="5"><title>Reports failures to 99</title></circle>';
      if (id === "99") s += '<circle class="faildot" cx="' + (x + NW - 12) + '" cy="' + y + '" r="5" style="fill:var(--surface);stroke:var(--fail);stroke-width:2"><title>Receives failures</title></circle>';
      s += "</g>";
    });
    return s + "</svg>";
  }
  function edgeText(id) {
    var into = [], calls = [], drives = [], serves = [];
    EDGES.forEach(function (e) {
      if (e.to === id) into.push(e.inText || edgeName(e.from));
      if (e.from === id) {
        if (e.kind === "serve") serves.push(e.outText || edgeName(e.to));
        else if (e.kind === "ext") drives.push(e.outText || e.to);
        else calls.push(e.outText || e.to);
      }
    });
    if (id === "99") into.push("failures from " + FAILS.join(", "));
    var r = [];
    function add(k, list) { if (list.length) r.push("<span><b>" + k + "</b>" + esc(list.join(", ")) + "</span>"); }
    add("From", into);
    add("Calls", id === "01" ? ["02A, 04, 05, 02, 03 in that order"] : calls);
    add("Drives", drives);
    add("Serves", serves);
    if (FAILS.indexOf(id) >= 0) r.push("<span><b>On error</b>reports to 99</span>");
    if (id === "00") r.push("<span><b>Runs</b>by hand, from its draft</span>");
    return r.join("");
  }
  function renderMap() {
    shell.classList.remove("has-side");
    side.innerHTML = "";
    var written = ORDER.filter(function (id) { return byId[id]; });
    var nodes = written.reduce(function (a, id) { return a + (byId[id].node_count || 0); }, 0);
    var h = '<section class="hero"><span class="eyebrow">Oak GTM Automation Challenge</span>';
    h += "<h1>The Live Event Lead Engine, node by node</h1>";
    h += "<p>A badge scan comes in at 01, gets CRM context, enrichment and bounded AI reasoning, then lands in HubSpot and as a Slack card a rep can act on. Open any workflow to walk its nodes in execution order.</p>";
    h += '<div class="status"><span><b>' + written.length + "</b> of " + ORDER.length + " workflows written</span><span><b>" + nodes + "</b> nodes explained</span><span>Talk track collapses each node to the line you say</span></div></section>";
    h += '<div class="mapbox">' + mapSVG() + "</div>";
    h += '<div class="legend">';
    h += '<span><svg viewBox="0 0 26 12" aria-hidden="true"><path class="edge" d="M1,6 L22,6" marker-end="url(#ah)"/></svg>calls a sub-flow (number = order inside 01)</span>';
    h += '<span><svg viewBox="0 0 26 12" aria-hidden="true"><path class="edge ext" d="M1,6 L22,6" marker-end="url(#ah)"/></svg>driven from outside n8n</span>';
    h += '<span><svg viewBox="0 0 26 12" aria-hidden="true"><circle class="faildot" cx="13" cy="6" r="5"/></svg>reports failures to 99 (errorWorkflow)</span>';
    h += "</div>";
    h += '<div class="lanes">';
    LANES.forEach(function (l) {
      var ids = ORDER.filter(function (id) { return laneOf(id) === l.key; });
      h += '<section data-lane="' + l.key + '"><div class="lane-h"><span class="lane-dot"></span><h2>' + esc(l.label) + "</h2></div><ul class=\"wf-list\">";
      ids.forEach(function (id) {
        var w = byId[id];
        h += '<li><a class="wf-row' + (w ? "" : " missing") + '" data-lane="' + l.key + '" href="#' + tok(id) + '" data-go="' + tok(id) + '">';
        h += '<span class="wf-id">' + id + "</span><span class=\"wf-main\">";
        h += '<span class="wf-name">' + esc(shortOf(id)) + "<small>" + (w ? w.node_count + " nodes" : "not written yet") + "</small></span>";
        h += '<span class="wf-blurb">' + esc(w ? firstSentence(w.one_breath) : META[id].blurb) + "</span>";
        h += '<span class="wf-edges">' + edgeText(id) + "</span></span></a></li>";
      });
      h += "</ul></section>";
    });
    h += "</div>";
    main.innerHTML = h;
    document.title = "Oak Workflow Field Guide";

    var svg = document.getElementById("map-svg");
    if (svg) {
      svg.addEventListener("mouseover", function (ev) {
        var g = ev.target.closest && ev.target.closest(".mnode");
        if (!g) return;
        var id = g.getAttribute("data-id");
        svg.classList.add("focus");
        svg.querySelectorAll("[data-e]").forEach(function (el) {
          var k = el.getAttribute("data-e").split(">");
          el.classList.toggle("hot", k[0] === id || k[1] === id);
        });
      });
      svg.addEventListener("mouseleave", function () { svg.classList.remove("focus"); });
    }
  }

  /* ---------- workflow ---------- */
  function linkChips(list) {
    if (!list || !list.length) return '<span class="muted">None</span>';
    return '<span class="chips">' + list.map(function (s) {
      var id = idIn(s);
      if (id) {
        var rest = String(s).replace(/^\s*(02A|0\d|99)\b\s*/i, "");
        return '<a class="chip" href="#' + tok(id) + '" data-go="' + tok(id) + '"><span class="cid">' + id + "</span>" + esc(rest || shortOf(id)) + "</a>";
      }
      return '<span class="chip">' + esc(s) + "</span>";
    }).join("") + "</span>";
  }
  function toLink(w, name, steps) {
    var st = steps[name];
    if (st == null) return '<span class="to">' + esc(name) + "</span>";
    var t = nodeTok(w.id, st);
    return '<a class="to" href="#' + t + '" data-go="' + t + '"><span class="to-n">' + st + "</span>" + esc(name) + "</a>";
  }
  function labelClass(l) {
    var s = String(l).toLowerCase();
    if (s === "true" || s === "yes" || s === "success") return " t";
    if (s === "false" || s === "no" || s === "error") return " f";
    return "";
  }
  function nodeHTML(w, n, steps) {
    var id = String(w.id).toUpperCase();
    var branches = n.branches || [];
    var rows = "";
    function row(k, v, cls) { rows += "<dt>" + k + "</dt><dd" + (cls ? ' class="' + cls + '"' : "") + ">" + v + "</dd>"; }
    row("Why", esc(n.why));
    row("In, out", '<div class="io"><span>' + esc(n.in) + '</span><span class="io-a" aria-label="to">&rarr;</span><span>' + esc(n.out) + "</span></div>");
    if (n.decides) row("Decides", esc(n.decides), "dec");
    if (n.code) row("Code", '<div class="code" tabindex="0" aria-label="Code, scrolls sideways"><pre><code>' + esc(n.code) + "</code></pre></div>");
    if (branches.length) {
      row("Branches", '<ul class="forks">' + branches.map(function (b) {
        return '<li><div class="fork-line"><span class="blabel' + labelClass(b.label) + '">' + esc(b.label) + '</span><span class="muted" aria-hidden="true">&rarr;</span>' + toLink(w, b.goes_to, steps) + "</div>" + (b.meaning ? '<p class="bmeaning">' + esc(b.meaning) + "</p>" : "") + "</li>";
      }).join("") + "</ul>");
    }
    row("On failure", esc(n.on_failure));
    if (!branches.length) {
      var nx = n.next || [];
      row("Next", nx.length ? '<span class="nexts">' + nx.map(function (x) { return toLink(w, x, steps); }).join("") + "</span>" : '<span class="muted">Ends here</span>');
    }
    var t = nodeTok(id, n.step);
    var h = '<article class="node" id="' + t + '" data-step="' + n.step + '">';
    h += '<a class="step' + (branches.length ? " fork" : "") + '" href="#' + t + '" data-go="' + t + '" aria-label="Step ' + n.step + (branches.length ? ", branches" : "") + '" title="' + (branches.length ? "Branches here" : "Step " + n.step) + '">' + n.step + "</a>";
    h += '<div class="card"><header class="n-head"><h3 class="n-name">' + esc(n.name) + '</h3><span class="n-type">' + esc(n.type) + "</span></header>";
    h += '<div class="n-body"><p class="what">' + esc(n.what) + '</p><dl class="rows">' + rows + "</dl></div>";
    h += '<div class="say"><span class="k">Say it</span><p class="voice"><span class="hl">' + esc(n.say_it) + "</span></p></div>";
    h += "</div></article>";
    return h;
  }
  function pager(id) {
    var i = ORDER.indexOf(id), p = ORDER[i - 1], nx = ORDER[i + 1];
    var h = '<nav class="pager" aria-label="Other workflows">';
    h += p ? '<a href="#' + tok(p) + '" data-go="' + tok(p) + '"><small>Previous</small>' + esc(p + " " + shortOf(p)) + "</a>" : '<a href="#map" data-go="map"><small>Back</small>System map</a>';
    h += nx ? '<a href="#' + tok(nx) + '" data-go="' + tok(nx) + '"><small>Next</small>' + esc(nx + " " + shortOf(nx)) + "</a>" : '<a href="#map" data-go="map"><small>Done</small>System map</a>';
    return h + "</nav>";
  }
  function renderWf(id) {
    var w = byId[id], lane = laneOf(id);
    var h = '<div data-lane="' + lane + '">';
    h += '<nav class="crumb"><a href="#map" data-go="map">System map</a><span aria-hidden="true">/</span><span class="lane-dot"></span><span>' + esc(LANE_LABEL[lane]) + "</span></nav>";
    h += '<div class="wf-title"><span class="big-id">' + id + "</span><h1>" + esc(shortOf(id)) + "</h1></div>";
    if (!w) {
      shell.classList.remove("has-side");
      side.innerHTML = "";
      h += '<p class="canvas-name">Oak GTM - ' + esc(id + " " + META[id].short) + "</p>";
      h += '<div class="stub"><p>' + esc(META[id].blurb) + '</p><p style="margin-top:10px">The node-by-node notes for this workflow are not in this build yet. They appear after <code>guide-data/' + esc(id.toLowerCase()) + ".json</code> lands and the page is rebuilt.</p></div>";
      h += '<div class="wf-edges" style="margin-top:18px">' + edgeText(id) + "</div>";
      main.innerHTML = h + pager(id) + "</div>";
      document.title = id + " " + shortOf(id) + " | Oak Field Guide";
      return;
    }
    var groups = groupsOf(w), all = nodesOf(w), steps = {};
    all.forEach(function (n) { steps[n.name] = n.step; });
    h += '<p class="canvas-name">' + esc(w.name) + " &middot; " + w.node_count + " nodes</p>";
    h += '<div class="breath"><span class="k">Say this first</span><p class="voice"><span class="hl">' + esc(w.one_breath) + "</span></p></div>";
    h += '<p class="talk-note">Talk track is on. Say the line above, then each node\'s line in order: ' + all.length + " lines. Turn it off to see the detail again.</p>";
    h += '<dl class="facts">';
    h += "<dt>Trigger</dt><dd>" + esc(w.trigger) + "</dd>";
    h += "<dt>Input</dt><dd>" + esc(w.input) + "</dd>";
    h += "<dt>Output</dt><dd>" + esc(w.output) + "</dd>";
    h += "<dt>Called by</dt><dd>" + linkChips(w.called_by) + "</dd>";
    h += "<dt>Calls</dt><dd>" + linkChips(w.calls) + "</dd>";
    h += "</dl>";
    h += '<h2 class="sec-h">Nodes in execution order <small>' + all.length + " nodes, " + groups.length + (groups.length === 1 ? " group" : " groups") + "</small></h2>";
    h += '<div class="rail">';
    groups.forEach(function (g) {
      var first = g.nodes.length ? g.nodes[0].step : "", last = g.nodes.length ? g.nodes[g.nodes.length - 1].step : "";
      h += '<section class="group"><div class="g-head"><span class="g-mark" aria-hidden="true"></span><div><h3 class="g-name">' + esc(g.name) + '<span class="g-range">' + (first === last ? "step " + first : "steps " + first + "-" + last) + "</span></h3>";
      if (g.purpose) h += '<p class="g-purpose">' + esc(g.purpose) + "</p>";
      h += "</div></div>";
      g.nodes.forEach(function (n) { h += nodeHTML(w, n, steps); });
      h += "</section>";
    });
    h += "</div>";
    h += '<div class="after">';
    if (w.decisions && w.decisions.length) {
      h += '<section><h2 class="sec-h">Decisions worth defending</h2><ol class="decs">';
      w.decisions.forEach(function (d) { h += "<li><div><b>" + esc(d.title) + "</b></div><p>" + esc(d.why) + "</p></li>"; });
      h += "</ol></section>";
    }
    if (w.questions && w.questions.length) {
      h += '<section><h2 class="sec-h">Likely questions</h2><div class="q-tools"><span>Answer out loud first, then check.</span><button type="button" class="linkbtn" id="qa-all">Show all answers</button></div><div class="qa-list">';
      w.questions.forEach(function (q) {
        h += '<details class="qa"><summary><span>' + esc(q.q) + '</span><span class="rev" aria-hidden="true"></span></summary><p class="ans">' + esc(q.a) + "</p></details>";
      });
      h += "</div></section>";
    }
    h += "</div>";
    main.innerHTML = h + pager(id) + "</div>";
    document.title = id + " " + shortOf(id) + " | Oak Field Guide";

    // side index
    var s = '<div class="side-in"><p class="side-h">' + esc(id + " " + shortOf(id)) + "</p>";
    groups.forEach(function (g) {
      s += '<p class="side-h">' + esc(g.name) + "</p><ol>";
      g.nodes.forEach(function (n) {
        var t = nodeTok(id, n.step);
        s += '<li><a href="#' + t + '" data-go="' + t + '" data-step="' + n.step + '"><span class="n">' + n.step + "</span><span>" + esc(n.name) + "</span></a></li>";
      });
      s += "</ol>";
    });
    side.innerHTML = s + "</div>";
    shell.classList.add("has-side");

    var qaBtn = document.getElementById("qa-all");
    if (qaBtn) qaBtn.addEventListener("click", function () {
      var ds = main.querySelectorAll("details.qa");
      var anyClosed = Array.prototype.some.call(ds, function (d) { return !d.open; });
      ds.forEach(function (d) { d.open = anyClosed; });
      qaBtn.textContent = anyClosed ? "Hide all answers" : "Show all answers";
    });
    spy();
  }

  /* ---------- scroll spy for the side index ---------- */
  var observer = null;
  function spy() {
    if (observer) observer.disconnect();
    if (!("IntersectionObserver" in window)) return;
    var links = {};
    side.querySelectorAll("a[data-step]").forEach(function (a) { links[a.getAttribute("data-step")] = a; });
    var cur = null;
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          var st = en.target.getAttribute("data-step");
          if (cur) cur.classList.remove("cur");
          cur = links[st] || null;
          if (cur) cur.classList.add("cur");
        }
      });
    }, { rootMargin: "-90px 0px -65% 0px" });
    main.querySelectorAll(".node").forEach(function (n) { observer.observe(n); });
  }

  /* ---------- routing ---------- */
  var current = null;
  function render(view) {
    if (view === "map") renderMap(); else renderWf(view);
    current = view;
    pick.value = view === "map" ? "map" : tok(view);
  }
  function flash(el) {
    el.classList.add("flash");
    setTimeout(function () { el.classList.remove("flash"); }, 1800);
  }
  function scrollToNode(id, step) {
    var el = document.getElementById(nodeTok(id, step));
    if (!el) return;
    el.scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" });
    flash(el);
  }
  function route(token, opts) {
    opts = opts || {};
    var p = parseTok(token);
    var view = p ? p.id : "map";
    var changed = view !== current;
    if (changed) render(view);
    state.last = view;
    save();
    if (p && p.step) {
      if (changed) requestAnimationFrame(function () { scrollToNode(view, p.step); });
      else scrollToNode(view, p.step);
    } else if (opts.restore) {
      restoreScroll(view);
    } else if (changed) {
      window.scrollTo(0, 0);
    }
  }
  function go(token) {
    try { history.pushState(null, "", "#" + token); } catch (e) { /* sandboxed: route anyway */ }
    route(token);
  }
  window.addEventListener("popstate", function () { route(location.hash.slice(1)); });
  window.addEventListener("hashchange", function () { route(location.hash.slice(1)); });

  var userMoved = false;
  ["wheel", "touchstart", "keydown", "mousedown"].forEach(function (ev) {
    window.addEventListener(ev, function () { userMoved = true; }, { passive: true, once: true });
  });
  function restoreScroll(view) {
    var y = +(state.scroll && state.scroll[view]) || 0;
    if (!y) return;
    requestAnimationFrame(function () { window.scrollTo(0, y); });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { if (!userMoved) window.scrollTo(0, y); });
    }
  }
  var scrollTick = null;
  window.addEventListener("scroll", function () {
    if (scrollTick) return;
    scrollTick = setTimeout(function () {
      scrollTick = null;
      if (current) { state.scroll[current] = Math.round(window.scrollY); save(); }
    }, 250);
  }, { passive: true });

  document.addEventListener("click", function (ev) {
    var a = ev.target.closest && ev.target.closest("[data-go]");
    if (!a || ev.metaKey || ev.ctrlKey || ev.shiftKey) return;
    ev.preventDefault();
    closeSearch();
    go(a.getAttribute("data-go"));
  });
  document.addEventListener("keydown", function (ev) {
    var t = ev.target;
    if (ev.key === "Enter" && t && t.classList && t.classList.contains("mnode")) { go(t.getAttribute("data-go")); return; }
    var typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT");
    if (typing || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.key === "/") { ev.preventDefault(); openSearch(); }
    else if (ev.key === "t" || ev.key === "T") setTalk(!root.classList.contains("talk"));
  });

  /* ---------- talk track ---------- */
  function setTalk(on) {
    var anchor = null, off = 0;
    var nodes = main.querySelectorAll(".node");
    for (var i = 0; i < nodes.length; i++) {
      var r = nodes[i].getBoundingClientRect();
      if (r.bottom > 80) { anchor = nodes[i]; off = r.top; break; }
    }
    root.classList.toggle("talk", on);
    talkBtn.setAttribute("aria-pressed", on ? "true" : "false");
    state.talk = on;
    save();
    if (anchor && window.scrollY > 0) window.scrollBy(0, anchor.getBoundingClientRect().top - off);
  }
  talkBtn.addEventListener("click", function () { setTalk(!root.classList.contains("talk")); });

  /* ---------- search ---------- */
  var INDEX = [];
  ORDER.forEach(function (id) {
    var w = byId[id];
    if (!w) return;
    INDEX.push({ kind: "wf", id: id, name: id + " " + shortOf(id), f: { name: id + " " + shortOf(id) + " " + w.name, say: w.one_breath } });
    nodesOf(w).forEach(function (n) {
      INDEX.push({ kind: "node", id: id, step: n.step, name: n.name, type: n.type, f: { name: n.name, what: n.what, why: n.why, say: n.say_it } });
    });
  });
  INDEX.forEach(function (e) {
    e.hay = [e.f.name, e.f.what, e.f.why, e.f.say].join(" \u0001 ").toLowerCase();
  });
  var sEl = document.getElementById("search"), scrim = document.getElementById("scrim");
  var qIn = document.getElementById("q"), qMeta = document.getElementById("q-meta"), qRes = document.getElementById("q-results");
  var active = -1, lastFocus = null;
  function openSearch() {
    lastFocus = document.activeElement;
    sEl.hidden = false;
    scrim.hidden = false;
    qIn.focus();
    qIn.select();
    runSearch();
  }
  function closeSearch() {
    if (sEl.hidden) return;
    sEl.hidden = true;
    scrim.hidden = true;
    if (lastFocus && lastFocus.focus) try { lastFocus.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  }
  document.getElementById("open-search").addEventListener("click", openSearch);
  document.getElementById("close-search").addEventListener("click", closeSearch);
  scrim.addEventListener("click", closeSearch);
  function hlText(text, terms) {
    var out = esc(text);
    terms.forEach(function (t) {
      var re = new RegExp("(" + esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
      out = out.replace(re, "<mark>$1</mark>");
    });
    return out;
  }
  function snippet(text, term) {
    var s = String(text || ""), i = s.toLowerCase().indexOf(term);
    if (i < 0) return s.length > 150 ? s.slice(0, 150) + "..." : s;
    var a = Math.max(0, i - 60), b = Math.min(s.length, i + term.length + 90);
    return (a > 0 ? "..." : "") + s.slice(a, b) + (b < s.length ? "..." : "");
  }
  function runSearch() {
    var q = qIn.value.trim().toLowerCase();
    active = -1;
    if (!q) {
      qMeta.textContent = INDEX.length ? "Searches every node name, what, why and say-it line across " + Object.keys(byId).length + " workflows. Try: thread anchor, 0.7, keep, Promote." : "No workflow notes in this build yet.";
      qRes.innerHTML = "";
      return;
    }
    var terms = q.split(/\s+/).filter(Boolean);
    var hits = [];
    INDEX.forEach(function (e) {
      if (!terms.every(function (t) { return e.hay.indexOf(t) >= 0; })) return;
      var nm = e.f.name.toLowerCase(), sc = 0;
      if (nm.indexOf(q) >= 0) sc += 20;
      terms.forEach(function (t) { if (nm.indexOf(t) >= 0) sc += 5; if ((e.f.say || "").toLowerCase().indexOf(t) >= 0) sc += 1; });
      if (e.kind === "wf") sc += 2;
      hits.push({ e: e, sc: sc });
    });
    hits.sort(function (a, b) {
      return b.sc - a.sc || ORDER.indexOf(a.e.id) - ORDER.indexOf(b.e.id) || (a.e.step || 0) - (b.e.step || 0);
    });
    var shown = hits.slice(0, 60);
    qMeta.textContent = hits.length ? hits.length + (hits.length === 1 ? " match" : " matches") + (hits.length > shown.length ? ", showing " + shown.length : "") : "No node mentions that. Try fewer words.";
    qRes.innerHTML = shown.map(function (h, i) {
      var e = h.e, t = e.kind === "wf" ? tok(e.id) : nodeTok(e.id, e.step);
      var field = "what", ft = terms[0];
      ["say", "what", "why"].some(function (k) { if ((e.f[k] || "").toLowerCase().indexOf(ft) >= 0) { field = k; return true; } return false; });
      var lbl = { say: "Say it", what: "What", why: "Why" }[field];
      var where = e.kind === "wf" ? "Workflow" : e.id + " step " + e.step;
      return '<a href="#' + t + '" data-go="' + t + '" role="option" id="r' + i + '" aria-selected="false"><span class="r-top"><span class="r-where">' + esc(where) + '</span><span class="r-name">' + hlText(e.name, terms) + "</span>" + (e.type ? '<span class="r-where">' + esc(e.type) + "</span>" : "") + '</span><span class="r-snip"><i>' + lbl + "</i>" + hlText(snippet(e.f[field], ft), terms) + "</span></a>";
    }).join("");
  }
  function setActive(i) {
    var items = qRes.querySelectorAll("a");
    if (!items.length) return;
    active = (i + items.length) % items.length;
    items.forEach(function (a, k) { a.setAttribute("aria-selected", k === active ? "true" : "false"); });
    items[active].scrollIntoView({ block: "nearest" });
  }
  qIn.addEventListener("input", runSearch);
  qIn.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowDown") { ev.preventDefault(); setActive(active + 1); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); setActive(active - 1); }
    else if (ev.key === "Enter") {
      ev.preventDefault();
      var items = qRes.querySelectorAll("a");
      var a = items[active >= 0 ? active : 0];
      if (a) { closeSearch(); go(a.getAttribute("data-go")); }
    }
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") closeSearch(); });

  /* ---------- boot ---------- */
  if (state.talk) { root.classList.add("talk"); talkBtn.setAttribute("aria-pressed", "true"); }
  var h0 = location.hash.slice(1);
  var p0 = parseTok(h0);
  if (p0) route(h0, { restore: !p0.step && state.last === p0.id });
  else if (h0 === "map") route("map", { restore: state.last === "map" });
  else if (state.last && state.last !== "map" && ORDER.indexOf(state.last) >= 0) route(tok(state.last), { restore: true });
  else route("map", { restore: true });
})();
</script>
