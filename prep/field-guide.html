ue-on-error in 01. 02A soft-fails every HubSpot call internally, so in practice it returns; a hard error would stop 01 after the 202, go to 99, and leave the ledger 'accepted' for a retry.","say_it":"The CRM is read before anything is enriched or reasoned about, so HubSpot's facts outrank the web and the AI.","next":["Enrich Company"]},{"step":26,"name":"Enrich Company","type":"Execute Sub-workflow (04)","what":"Calls 04 'Company & Person Enrichment' (K9MaVwjIoBmZ0oS9) and waits. 04 reuses the cache or reads the homepage (always free), adds paid Brave search unless the scan is out_of_scope, skips person search for competitors, resolves headcount (HubSpot 1.0, booth notes 0.9, official site 0.85, domain-matched search 0.7) and industry, recomputes the size band, can flag a possible competitor (to needs_review), can downgrade on size or a public-site disqualifier, adds size and industry points (never for out_of_scope or competitor_intel), and recomputes notification_mode. It does NOT change persona_reasoning_required.","why":"Headcount and industry are the facts the booth notes usually lack, and the homepage read is how a small competitor that is not in the table still gets caught.","in":"The payload with crm_context from 02A.","out":"The payload with company_enrichment, employee_resolution, company_size_band, possibly a new classification / competitor_status / routing, updated score and breakdown, enrichment_cache_hit and warnings.","decides":"The resolved size band and, for competitor and out_of_scope leads, effectively the final classification (it also applies the rep override for leads that skip the gate).","code":"workflowId: K9MaVwjIoBmZ0oS9  waitForSubWorkflow: true","branches":[],"on_failure":"No continue-on-error in 01; 04's external calls soft-fail internally. A hard error stops 01 after the 202 (99 reports, ledger stays 'accepted').","say_it":"Enrichment always does the free homepage read, even for bad-fit leads, because that is how an unlisted competitor gets caught.","next":["Needs AI Synthesis?"]},{"step":27,"name":"Needs AI Synthesis?","type":"IF","what":"IF persona_reasoning_required is true (boolean, strict). That flag was set by Evaluate ICP Policy and nothing recomputes it: true for tier_1, matched and needs_review as classified before enrichment, false for competitor_intel and out_of_scope.","why":"This is the spend gate on Gemini: competitors and out-of-scope leads never cost an LLM call.","in":"persona_reasoning_required (01's pre-enrichment verdict).","out":"The item on the true or false output.","decides":"Whether Gemini runs and whether the final gate runs.","code":"leftValue: {{ $json.persona_reasoning_required }}  operator: boolean true","branches":[{"label":"true","goes_to":"Reason with AI","meaning":"01 called it tier_1, matched or needs_review: call 05, then the final deterministic gate."},{"label":"false","goes_to":"Can Sync Contact?","meaning":"01 called it competitor_intel or out_of_scope: skip AI and the final gate; 04 had the last deterministic word."}],"on_failure":"An IF on a boolean does not realistically fail. Because the flag is 01's pre-enrichment verdict, a lead 04 demotes to out_of_scope still goes through AI (and pays for it), and a lead 01 called out_of_scope that 04 moves to needs_review (possible competitor from the homepage) skips AI and the gate, so 04's needs_review stands.","say_it":"Gemini is only paid for leads the rules thought worth a conversation; competitors and out-of-scope scans skip it.","next":["Reason with AI","Can Sync Contact?"]},{"step":28,"name":"Reason with AI","type":"Execute Sub-workflow (05)","what":"Calls 05 'AI Lead Reasoning' (McoAVyLN6lxqmLeO) and waits. 05 skips Gemini entirely if injection_suspected. Otherwise Gemini (temperature 0, strict JSON) writes the opening question, why it matters, a booth action and listen-fors, and a guard clamps every field. It can change the tier only when persona_status is 'ambiguous': at confidence \u003e= 0.7 a target persona moves the lead to matched (or tier_1 if 01 already quoted an urgency trigger) and adds persona points; confidently 'other' moves it to out_of_scope; below 0.7 it stays needs_review. It may also fill an unknown industry from a supplied URL above 0.7 and add industry points. A clear title rule is never overridden.","why":"Language understanding earns its place only for ambiguous titles and for writing a grounded question; everything else stays deterministic.","in":"The enriched payload from 04.","out":"The payload with persona / persona_source, possibly a new classification and routing, updated score, opening_question, recommended_action, why_this_matters, listen_for, public_context, ai {status, model, prompt_version}, ai_warnings, ai_changed_classification.","decides":"Persona for an ambiguous title (and the tier that follows), plus the conversation content.","code":"workflowId: McoAVyLN6lxqmLeO  waitForSubWorkflow: true","branches":[],"on_failure":"onError continueRegularOutput plus alwaysOutputData, the only sub-workflow call in 01 that continues on error. If 05 hard-fails, the output is an error item with no lead fields: the gate then runs on an almost empty object, Persist Final Classification writes with an empty key, and Restore Enriched Payload falls back to the Enrich Company output, so the lead continues on its post-04 decision without the final gate.","say_it":"The AI can only resolve an ambiguous title above 0.7 confidence, and a failure there falls back to the deterministic result instead of stopping the lead.","next":["Load Gate Policy"]},{"step":29,"name":"Load Gate Policy","type":"Data Table get","what":"Reads the active oak_policies row again (status = active, limit 1).","why":"Prepare CRM Handoff removed the policy from the payload, so without this reload the gate would route with its hard-coded fallback channels.","in":"Runs once for the item from Reason with AI.","out":"The active policy row.","decides":null,"code":"filters: status = active  limit: 1","branches":[],"on_failure":"continueRegularOutput and alwaysOutputData. If it returns nothing, the gate falls back to x.policy, which was removed, so it routes with hard-coded channel names (booth-hot, booth-matched, booth-review, competitive-intel, booth-out-of-scope).","say_it":"The final gate reloads the policy so its routing comes from data, not hard-coded fallbacks.","next":["Enforce Final Deterministic Gates"]},{"step":30,"name":"Enforce Final Deterministic Gates","type":"Code","what":"Runs after AI so the rules always outrank the model. Cascade: confirmed competitor -\u003e competitor_intel; else size band disqualified_under_500 -\u003e out_of_scope, unless the lead is a possible competitor, which stays in needs_review as in 04; else a saas-only / single-cloud disqualifier that 04 found on the company's site, on a lead 05 lifted off out_of_scope -\u003e back to out_of_scope with 04's reason 'Public evidence indicates ...'; else review_500_999 (and not out_of_scope) -\u003e needs_review with the reason 'Final deterministic gate kept the lead in review because 500-999 employees is below the qualified 1,000+ threshold'; else a possible competitor that 05 moved off needs_review -\u003e back to needs_review ('Review: possible competitor'); else out_of_scope stays out_of_scope; else the tier stands and is routed from the policy (mention only for tiers in mention_tiers). For a target persona with unknown size it adds a confirm-at-booth reason and appends '(headcount to confirm)' to the rule summary. It drops any reason starting 'null employees'. Then the rep override from 06 is applied last: same as the gate's answer, note that the rep agreed; different and not contradicted, the rep wins (routed to the override's channel, mention off, trace rep_override_honoured); a Not a fit (out_of_scope) override and a source at confidence \u003e= 0.9 puts the company at 1,000+, the lead goes to needs_review with 'Conflict: rep marked this ..., but N employees from \u003csource\u003e qualifies the company' (trace rep_override_contradicted). Promote, Matched and False alarm are never contradicted by headcount. Finally it stamps decision_basis with final_deterministic_gate true, gate_policy_version and the override flags.","why":"Whatever the model said, confirmed and possible competitor, size band, a public-site disqualifier and a rep's decision are re-applied from a freshly loaded policy, so a tier is always explainable by a rule.","in":"$('Reason with AI').first().json, $('Load Gate Policy').first().json.document_json.","out":"{...lead, classification, routing, decision_reasons, decision_trace, rule_summary, decision_basis:{..., final_deterministic_gate:true, gate_policy_version, unknown_size_requires_review:false, unknown_size_confirm_at_booth, rep_override_applied, rep_override_value, rep_override_contradicted}}","decides":"The settled classification and routing for tier_1 / matched / needs_review leads, including whether a rep override stands.","code":"if(x.competitor_status==='confirmed'&&x.competitor){ classification='competitor_intel'; ... }\nelse if(x.company_size_band==='disqualified_under_500'&&!possibleCompetitor){ classification='out_of_scope'; ... }\nelse if(siteDisq.length&&!possibleCompetitor&&classification!=='out_of_scope'&&classification!=='competitor_intel'){ classification='out_of_scope'; ... }\nelse if(x.company_size_band==='review_500_999'&&classification!=='out_of_scope'){ classification='needs_review'; ... }\nelse if(possibleCompetitor&&classification!=='needs_review'){ classification='needs_review'; ... }\nelse if(classification==='out_of_scope'){ route('out_of_scope','booth-out-of-scope'); ... }\nelse { route(classification, ...); }\nconst contradicted=ovr==='out_of_scope'&&Number(er.confidence||0)\u003e=0.9&&String(x.company_size_band||'')==='qualified_1000_plus';","branches":[],"on_failure":"No error settings. An honoured override always sets mention false, so a Promote to Tier 1 on a re-scan posts to booth-hot without @here.","say_it":"The final gate runs after the AI and re-applies competitor, size band and the rep's own decision, so the model can describe a lead but never overrule a rule.","next":["Persist Final Classification"]},{"step":31,"name":"Persist Final Classification","type":"Data Table upsert","what":"Upserts oak_encounters on event_person_key with the settled last_classification, last_score, last_score_breakdown, last_decision_reasons, last_rule_summary, identity fields, hubspot_contact_id, source_json (which source supplied name, title, company, domain, notes, CRM, public company and person data), person_evidence_json, company_evidence_json, crm_context_json and last_payload_json (the whole payload without policy).","why":"AI or the gate may have moved the tier after the 202; this makes the encounter's durable classification match what HubSpot and Slack are about to receive.","in":"$json from Enforce Final Deterministic Gates.","out":"The upserted encounter row.","decides":null,"code":"filters: event_person_key = {{ $json.event_person_key }}\nlast_classification: {{ $json.classification }}\nlast_payload_json: {{ JSON.stringify(Object.fromEntries(Object.entries($json).filter(([k]) =\u003e k !== 'policy'))) }}","branches":[],"on_failure":"No error settings: a failure stops the run (99 reports it) with the ledger still 'accepted', so a resend retries. Only the AI path reaches this node; competitor and out_of_scope leads are persisted later by Persist Complete Encounter.","say_it":"The settled tier is written back to the encounter as soon as the gate decides it.","next":["Restore Enriched Payload"]},{"step":32,"name":"Restore Enriched Payload","type":"Code","what":"Returns the gate's output if it has a scan_id, otherwise the Enrich Company output.","why":"The item coming in is a Data Table write result, not the lead. And if 05 hard-failed, the gate ran on an empty error item, so falling back to the post-04 payload keeps the lead intact.","in":"$('Enforce Final Deterministic Gates').first().json, $('Enrich Company').first().json","out":"The lead payload.","decides":"Which payload continues: the gated one, or the post-04 one if the gate had nothing real to work on.","code":"return[{json:(ai&&ai.scan_id)?ai:enriched}];","branches":[],"on_failure":"No settings; simple selection.","say_it":"Restore Enriched Payload puts the lead back on the wire after the Data Table write, with a safe fallback if the AI step failed.","next":["Can Sync Contact?"]},{"step":33,"name":"Can Sync Contact?","type":"IF","what":"IF email_valid is true (boolean, strict). Three arrows land here: Needs Intelligence? false, Needs AI Synthesis? false (competitor_intel and out_of_scope leads, carrying the 04 output) and Restore Enriched Payload.","why":"Email is the only safe dedupe key for a HubSpot contact; without one, 02 would have to guess and could duplicate.","in":"email_valid","out":"The item on the true or false output.","decides":"Whether HubSpot is written.","code":"leftValue: {{ $json.email_valid }}  operator: boolean true","branches":[{"label":"true","goes_to":"Sync to HubSpot","meaning":"Valid email: write HubSpot through 02."},{"label":"false","goes_to":"Settle Final Payload","meaning":"No valid email: skip the CRM write; intelligence, storage and Slack still happen."}],"on_failure":"An IF on a boolean does not realistically fail.","say_it":"No email means no CRM write, but the lead is still classified, stored and alerted.","next":["Sync to HubSpot","Settle Final Payload"]}]},{"name":"5. Write the CRM","purpose":"Runs only when the scan carried an email, because email is the only safe dedupe key. Workflow 02 is the single automated writer to HubSpot.","nodes":[{"step":34,"name":"Sync to HubSpot","type":"Execute Sub-workflow (02)","what":"Calls 02 'HubSpot Sync' (WQ2s5hFfpaE8P45o) with the settled payload and waits. 02 finds or creates the company by domain, upserts the contact on email while keeping human-typed values, writes the Oak properties in one PATCH, logs a meeting and an associated note, and returns the payload with a post-write crm_context (real contact id and URL, company URL, owner name, open deals, warnings).","why":"One automated writer means one place to reason about what the CRM can contain, and it runs after the tier is settled so HubSpot never stores a provisional decision.","in":"The settled payload (Can Sync Contact? true).","out":"The payload with crm_context replaced by 02's post-write version.","decides":null,"code":"workflowId: WQ2s5hFfpaE8P45o  waitForSubWorkflow: true","branches":[],"on_failure":"No continue-on-error in 01. 02 soft-fails each HubSpot call internally and reports warnings; a hard error stops 01, 99 reports it, and the ledger stays 'accepted' so a resend retries.","say_it":"HubSpot is written once, by one sub-workflow, after the decision is final.","next":["Settle Final Payload"]}]},{"name":"6. Settle and persist the record","purpose":"Both sides of the email gate meet here, so the delivery ledger reaches complete even for a scan that never produced a CRM write.","nodes":[{"step":35,"name":"Settle Final Payload","type":"Code","what":"The meeting point for both branches of Can Sync Contact?. It picks the richest package that has a scan_id: the Sync to HubSpot output if 02 ran, else the incoming item, else Restore Enriched Payload, else the incoming item as-is.","why":"Before this node, a scan without an email skipped the two persist-complete writes along with 02, so its ledger row stayed 'accepted' forever (seed test 19 now asserts it reaches 'complete').","in":"$('Sync to HubSpot') (if it ran), $input, $('Restore Enriched Payload').","out":"The final lead package.","decides":"Which payload is the final record.","code":"try { const s = $('Sync to HubSpot').first().json; if (s && s.scan_id) pkg = s; } catch (e) { pkg = null; }\nif (!pkg) { const i = $input.first().json; if (i && i.scan_id) pkg = i; }\nif (!pkg) { try { const r = $('Restore Enriched Payload').first().json; if (r && r.scan_id) pkg = r; } catch (e) { pkg = null; } }","branches":[],"on_failure":"No settings; every lookup is in try/catch.","say_it":"Settle Final Payload makes sure a scan without an email still reaches 'complete' in the ledger.","next":["Persist Complete Encounter"]},{"step":36,"name":"Persist Complete Encounter","type":"Data Table update","what":"Updates oak_encounters where event_person_key matches, writing the final identity, last_classification, last_score, breakdown, reasons, rule summary, hubspot_contact_id, source_json, evidence JSON, crm_context_json and last_payload_json (without policy).","why":"This is the durable final snapshot of the person used for audit, for the next scan's comparison, and for 06's button actions. It is the only final write for competitor and out_of_scope leads, which skip Persist Final Classification.","in":"$json from Settle Final Payload.","out":"The updated row (or an empty item).","decides":null,"code":"filters: event_person_key = {{ $json.event_person_key }}\nlast_classification: {{ $json.classification }}","branches":[],"on_failure":"continueRegularOutput and alwaysOutputData: a failed write does not stop the ledger update or the Slack post.","say_it":"The encounter row ends each scan holding the final decision and the whole payload.","next":["Persist Complete Delivery"]},{"step":37,"name":"Persist Complete Delivery","type":"Data Table update","what":"Updates oak_deliveries where scan_id matches (read from Settle Final Payload, because the incoming item is a Data Table result), setting the final classification, score, raw_json (the full settled payload without policy) and status 'complete'.","why":"From this moment a replay of the scan_id is a duplicate, and raw_json is the complete decision record that 06 reloads when a rep reclassifies.","in":"$('Settle Final Payload').first().json","out":"The updated row (or an empty item).","decides":"That the scan is complete (replays are now ignored).","code":"filters: scan_id = {{ $('Settle Final Payload').first().json.scan_id }}\nstatus: complete","branches":[],"on_failure":"continueRegularOutput and alwaysOutputData. Note the ordering: 'complete' is set BEFORE Notify Slack runs, so if the Slack sub-workflow later fails hard, re-sending the scan returns duplicate_ignored and will not repost the card.","say_it":"Marking the ledger complete is the moment the scan becomes replay-proof.","next":["Restore Complete Package"]},{"step":38,"name":"Restore Complete Package","type":"Code","what":"Re-emits the Settle Final Payload item.","why":"The item coming in is the Data Table write result; 03 needs the lead object.","in":"$('Settle Final Payload').first().json","out":"The final lead package.","decides":null,"code":"return[{json:$('Settle Final Payload').first().json}];","branches":[],"on_failure":"No settings; trivial.","say_it":"A one-line node that puts the lead back on the wire for Slack.","next":["Notify Slack"]}]},{"name":"7. Alert the booth","purpose":"Post the card, or reply in the returning visitor's thread, then record what Slack actually did so a failed post cannot pass silently.","nodes":[{"step":39,"name":"Notify Slack","type":"Execute Sub-workflow (03)","what":"Calls 03 'Slack Alerts' (gyCxnkoGkh3OJpz5) with the final package and waits. 03 posts the card to the routed channel or replies in the returning visitor's thread; tier_1 gets @here and the owner DM, out_of_scope goes quietly to booth-out-of-scope with no buttons. It returns a delivery receipt.","why":"The alert is the product for the rep; it goes last so it carries the settled tier and the real HubSpot link and owner.","in":"The final package from Restore Complete Package.","out":"03's delivery receipt (targets tried, Slack answers, errors) including scan_id.","decides":null,"code":"workflowId: gyCxnkoGkh3OJpz5  waitForSubWorkflow: true","branches":[],"on_failure":"No continue-on-error in 01. 03 soft-fails Slack calls internally into the receipt; a hard error would reach 99, and since the ledger is already 'complete' a resend would not repost.","say_it":"Slack is the last step, so the card always shows the settled tier and the real CRM link.","next":["Persist Slack Delivery"]},{"step":40,"name":"Persist Slack Delivery","type":"Data Table update","what":"Updates oak_deliveries where scan_id matches, writing slack_json = the stringified receipt from 03.","why":"Slack failures are deliberately non-fatal, which is only acceptable because this receipt is stored and the 07 harness asserts on it.","in":"$json from Notify Slack (its scan_id and the whole receipt).","out":"The updated row. Last node; nothing follows.","decides":null,"code":"filters: scan_id = {{ $json.scan_id }}\nslack_json: {{ JSON.stringify($json) }}","branches":[],"on_failure":"continueRegularOutput and alwaysOutputData; if 03's receipt has no scan_id the update matches nothing.","say_it":"What Slack actually did is stored next to the decision, so a failed post is visible and testable.","next":[]}]}],"decisions":[{"title":"Answer 202 before enrichment","why":"A rep is standing in front of the visitor and a scanner cannot wait 20 seconds for web fetches and an LLM. The encounter and ledger rows are written first, then the reply goes out marked provisional, and oak_deliveries holds the authoritative decision once the run completes."},{"title":"Rules decide, the model describes","why":"Every tier and channel is deterministic code against the policy. 05 can only move a tier when persona_status is 'ambiguous' and its confidence is at least 0.7, and cannot invent urgency; the final gate then re-applies confirmed and possible competitor, size band, a public-site disqualifier and rep override from a freshly loaded policy."},{"title":"First-match-wins cascade with competitor on top","why":"Competitor beats everything so a competitor employee with a CISO title can never reach #booth-hot, and the possible-competitor name token sits above the size rule because calling a small competitor 'too small' is the expensive mistake."},{"title":"Replay blocks only completed scans","why":"A scan_id whose ledger row is 'complete' gets 200 duplicate_ignored. One still at 'accepted' (it died mid-pipeline) runs again on purpose, so a resend is the recovery path. A new scan_id for the same event_person_key is a returning visitor, always alerted, in the original card's thread."},{"title":"Unknown headcount never demotes","why":"The ICP disqualifies companies known to be under 500. An unknown size keeps the tier, awards no size points, and becomes a '(headcount to confirm)' question for the rep."},{"title":"Gate the spend, not the attention","why":"intelligence_required is true for all five classifications, so every scan gets the free CRM read and homepage read and a small competitor is still caught. Only Gemini (skipped for competitor_intel and out_of_scope) and paid search (skipped for out_of_scope, inside 04) are gated."}],"questions":[{"q":"Walk me through what happens when a scan comes in.","a":"Normalize Scan cleans the body, checks the secret, infers the company domain from a work email, builds event_person_key and hashes the notes. Authorized?, Valid Scan? and Duplicate Delivery? can each answer early (401, 400, 200). Otherwise it loads the active policy and competitors, Evaluate ICP Policy classifies with the first-match cascade, Build Visitor Context detects a returning visitor, Build Alert Package applies a fresh cache row, the encounter and ledger rows are upserted, and Respond Accepted returns 202. Then 02A, 04, 05, the final gate, 02 (if there is an email) and 03 run, and the ledger is marked complete."},{"q":"What is the classification order and why?","a":"Confirmed competitor, then a possible-competitor token in the company name, then known under 500 or saas-only / single-cloud, then target persona at 500-999 to review, then persona plus a quoted Tier 1 trigger to tier_1, persona alone to matched, identity or compliance context without a persona to needs_review, and everything else out_of_scope. Competitor first so a competitor never lands in #booth-hot; the name token above size because mistaking a competitor for a small bad fit is costly."},{"q":"How is the score computed and does it route anything?","a":"Persona 30 if the title matches a target persona, company size 15 only when the notes put the company at 1,000+, urgency 40 if any Tier 1 trigger was quoted, industry 0 at this stage; 04 and 05 add size and industry later, capped at scoring.max 100. The score explains the decision but never routes it: Rachel is tier_1 at 70 because persona plus a quoted SailPoint renewal is the rule, not because 70 crossed a threshold."},{"q":"How do the four task leads come out?","a":"Rachel Green, CISO, 'SailPoint, renewal coming up in 5 months': ciso persona plus incumbent_renewal (5 \u003c= 6) gives tier_1, #booth-hot with @here, 70 with headcount to confirm. Hiroshi Tanaka, 'Lead Identity Infrastructure Architect': the 'identity infrastructure' pattern gives iam, no trigger, so matched at 30; the NHI and API-key pain is evidence, not points. David Miller: '80 employees' and 'SaaS-only' give out_of_scope to #booth-out-of-scope. Sarah Connor: veza.com is a domain in oak_competitors, so competitor_intel to #competitive-intel."},{"q":"What stops the LLM from promoting a bad lead?","a":"05 only runs for tier_1, matched and needs_review, only changes a tier when persona_status is 'ambiguous', needs 0.7 confidence, and can only reach tier_1 if 01 already quoted an urgency trigger. It is skipped entirely if injection is suspected. Then Enforce Final Deterministic Gates re-applies confirmed and possible competitor, size band, a public-site disqualifier found by 04, and rep override from a reloaded policy, so a confident persona read cannot clear a competitor flag or a SaaS-only site."},{"q":"Duplicate vs returning visitor?","a":"Duplicate: same scan_id whose ledger row is 'complete'; 200 duplicate_ignored, nothing else runs. Returning visitor: same event_person_key (event_id|email) with a new scan_id; scan_count goes up, notification_mode is repeat_thread or repeat_escalation if the tier changed, and 03 replies in the first card's thread showing what they said last time. Caveat: re-sending a scan_id still at 'accepted' also finds its own encounter row, so the retry is counted as scan #2."},{"q":"What if a sub-workflow fails?","a":"The scanner already has its 202. Inside each sub-workflow external calls retry and continue, so most failures become warnings. In 01 only Reason with AI continues on error; a hard failure in 02A, 04, 02, Persist Final Classification or 03 stops the run, 99 reports it to #oak-revops, and because the ledger is still 'accepted' (before Persist Complete Delivery), re-sending the scan reruns it. The exception is Notify Slack: it runs after the ledger is marked complete, so a hard Slack failure cannot be retried by re-sending."},{"q":"Why is email the gate for the HubSpot write?","a":"Email is the only safe dedupe key for a contact. Without one, Can Sync Contact? skips 02, but the scan is still classified, enriched, stored and alerted, and Settle Final Payload makes sure the ledger still reaches 'complete'."}]},{"id":"02","name":"Oak GTM - 02 HubSpot Sync [sub-flow]","short":"HubSpot Sync","lane":"write","one_breath":"02 is the only place the automated pipeline writes to HubSpot. 01 calls it after the tier is settled, and only when the scan carried a valid email, because email is the only safe dedupe key. It resolves the company by domain (creating it if new), finds the contact, reads real deals and owners, upserts the contact without overwriting anything a human typed, writes the Oak properties, logs a meeting and a note, and hands back a post-write crm_context the Slack card uses.","trigger":"Execute Workflow Trigger 'When Called by Intake' (input source: passthrough), called by 01's 'Sync to HubSpot' with waitForSubWorkflow true","input":"The settled lead payload from 01 (policy removed): identity, classification, persona, score and breakdown, rule_summary, decision_reasons and decision_trace, company_enrichment, employee_resolution, evidence, AI fields, scan_count, and 02A's pre-write crm_context. Only called when email_valid is true.","output":"The same payload with crm_context replaced by the post-write version: lookup_status (complete | failed), hubspot_contact_id, hubspot_contact_url, hubspot_company_url, is_net_new, company, company_match, company_created, company_enriched, owner_id, owner_name, owner_email, owner_source, customer_status, open_deal, open_deal_count, related_deals, oak_properties_written, booth_conversation_engagement_id, booth_note_id, synced_at, warnings.","called_by":["01 Intake & Decision (node 'Sync to HubSpot', only when Can Sync Contact? is true)"],"calls":[],"node_count":15,"groups":[{"name":"Ungrouped","purpose":"The entry point: receives the settled lead payload from 01.","nodes":[{"step":1,"name":"When Called by Intake","type":"Execute Workflow Trigger","what":"Entry point. Input source 'passthrough', so 01's item arrives unchanged, with no declared schema. Every later node reads it with $('When Called by Intake').first().json, and Build CRM Context spreads it back out at the end.","why":"Passthrough keeps 01's call simple and lets 02 return the whole lead with only crm_context replaced.","in":"The settled payload from 01 (output of Restore Enriched Payload or Enrich Company, after Can Sync Contact? true).","out":"The same single item.","decides":null,"code":null,"branches":[],"on_failure":"The workflow's error workflow is 99; because 01 waits and 'Sync to HubSpot' has no continue-on-error, a hard failure inside 02 fails 01's run and leaves the ledger at 'accepted' (so a resend reruns it).","say_it":"02 is a passthrough sub-workflow: it receives the settled lead and returns it with a post-write crm_context.","next":["Find Company by Domain"]}]},{"name":"1. Resolve and enrich the company","purpose":"Domain is the company identity: exact lookup, create if new, and write an enriched headcount only when HubSpot has none.","nodes":[{"step":2,"name":"Find Company by Domain","type":"HubSpot (company searchByDomain)","what":"HubSpot company searchByDomain on the payload's company_domain, limit 1, returning name, domain, industry, numberofemployees, annualrevenue, hubspot_owner_id and lifecyclestage. This is a fresh read at write time; it does not reuse 02A's result.","why":"The company must be settled before the contact so the contact can be associated to it; reading again here avoids acting on a stale answer from minutes earlier.","in":"$('When Called by Intake').first().json.company_domain","out":"Zero or one company item.","decides":null,"code":"domain: {{ $('When Called by Intake').first().json.company_domain }}","branches":[],"on_failure":"retryOnFail 3 tries at 1500 ms, continueRegularOutput, alwaysOutputData: a miss or error reads as no company, which leads Resolve Company Write to plan a create.","say_it":"Company first, matched on exact domain, because the contact has to be associated to something real.","next":["Resolve Company Write"]},{"step":3,"name":"Resolve Company Write","type":"Code","what":"Plans the company write without calling HubSpot. No company found and there is a domain or name: plan a POST create with name and domain. Company found, HubSpot has no numberofemployees, and 04 resolved a headcount from a non-HubSpot source: plan a PATCH with numberofemployees only, plus a note like 'written from booth notes at 90% confidence'. Company found and nothing to add: no_change. Nothing at all: skipped_no_identity, targeting company 0. Industry is never written.","why":"Separating the plan from the call lets one HTTP node handle create, update and no-op, and makes the 'CRM beats enrichment' rule one readable line.","in":"Trigger payload (company_domain, company_name, employee_resolution or company_enrichment.employee_resolution) and Find Company by Domain.","out":"company_method, company_url, company_body (JSON string), existing_company_id, company_action (create | update | no_change | skipped_no_identity), company_props, company_write_notes.","decides":"Whether the company is created, enriched with a headcount, left alone or skipped.","code":"if(resolved!=null&&String(er.source||'')!=='hubspot_company'&&!crmEmp){props.numberofemployees=String(resolved);...}\nif(canCreate){method='POST';url='https://api.hubapi.com/crm/v3/objects/companies';body={properties:props};action='create';}\nelse if(companyId&&hasProps){method='PATCH';...action='update';}\nelse if(companyId){action='no_change';}","branches":[],"on_failure":"No error settings; the code only reads prior items, so it is unlikely to throw. A hard error would fail the sub-workflow and go to 99.","say_it":"Resolve Company Write is where 'the CRM beats enrichment' lives: a web or booth headcount is written only when HubSpot has none, and industry is never guessed onto HubSpot's enum.","next":["Create or Update Company"]},{"step":4,"name":"Create or Update Company","type":"HTTP Request","what":"One HTTP node whose method, URL and body all come from the plan: POST /crm/v3/objects/companies for a create, PATCH /crm/v3/objects/companies/{id} for an update. For no_change and skipped_no_identity it still sends a PATCH with an empty properties object (to company 0 when there is no id, which 404s harmlessly). The response option neverError is on.","why":"One node instead of an IF plus two nodes keeps the canvas linear and the write logic in the planner.","in":"$json.company_method, $json.company_url, $json.company_body from Resolve Company Write.","out":"HubSpot's response body; on a successful create it contains the new company id.","decides":null,"code":"method: {{ $json.company_method }}  url: {{ $json.company_url }}  body: {{ $json.company_body }}","branches":[],"on_failure":"retryOnFail 2 tries at 1500 ms, continueRegularOutput, alwaysOutputData. Because neverError is on, a HubSpot 4xx does not raise an error; it returns HubSpot's error body, which has no 'error' field. A failed create is still caught downstream (no id came back), but a failed update PATCH would read as success in Resolve Company Id.","say_it":"A single HTTP node executes whatever the planner decided, so create, enrich and no-op are one step on the canvas.","next":["Resolve Company Id"]},{"step":5,"name":"Resolve Company Id","type":"Code","what":"Settles which company id the contact will be associated to: the new id from the create response, else the existing id. Flags company_created and company_updated, and turns problems into readable warnings: create returned no id ('The contact will not be associated to a company'), update errored, or no company identity on the scan.","why":"An orphaned contact is not a clean CRM; this node makes a failed company write visible on the card instead of silent.","in":"Resolve Company Write (plan) and Create or Update Company (response).","out":"company_id, company_created, company_updated, company_action, company_props_written, company_write_notes, company_warnings.","decides":"The company_id used for the contact association and deal lookup.","code":"const companyId=newId||plan.existing_company_id||'';\nconst created=Boolean(plan.company_action==='create'&&newId);\nconst updated=Boolean(plan.company_action==='update'&&!err);","branches":[],"on_failure":"No error settings; reads prior outputs defensively in try/catch. Known limit: with neverError upstream, 'err' only catches transport errors, so an HTTP 4xx on an update still sets company_updated true.","say_it":"Resolve Company Id guarantees the contact is associated to a real company id, or that a warning explains why not.","next":["Find HubSpot Contact"]}]},{"name":"2. Resolve contact and real deals","purpose":"Contact by email, genuinely associated deals via v4, owner ids resolved to names, then a write plan that preserves human-entered fields.","nodes":[{"step":6,"name":"Find HubSpot Contact","type":"HubSpot (contact search)","what":"HubSpot contact search, email equals the scan email, limit 1. It reads the fields keep() compares against (email, firstname, lastname, jobtitle, company, website, lifecyclestage, hs_lead_status, hubspot_owner_id, createdate, hs_object_id) plus the rep's event fields oak_booth_status, oak_exclude_from_outreach, oak_claimed_by and oak_claimed_at.","why":"Without the existing values the upsert would overwrite a rep's corrected title or reset a claimed lead to 'scanned'.","in":"$('When Called by Intake').first().json.email","out":"Zero or one contact item with id and properties.","decides":null,"code":"propertyName: email  value: {{ $('When Called by Intake').first().json.email }}","branches":[],"on_failure":"retryOnFail 3 tries at 1500 ms, continueRegularOutput, alwaysOutputData. If it fails, or the search index has not yet caught up with a contact created seconds ago, it reads as a new contact: keep() then sends scanner values and lifecyclestage 'lead' / hs_lead_status 'NEW'.","say_it":"The contact is read before it is written so every human-entered value can be preserved.","next":["Get Company Deal Associations"]},{"step":7,"name":"Get Company Deal Associations","type":"HTTP Request","what":"GET https://api.hubapi.com/crm/v4/objects/companies/{company_id}/associations/deals, using company id 0 when there is none. Returns the list of deal ids really associated to the company.","why":"It replaced a deal search on associations.company, which n8n flagged because it is a search key rather than a real property, and which can lag. A write-side view of open deals must be authoritative.","in":"$('Resolve Company Id').first().json.company_id","out":"results[] with toObjectId for each associated deal.","decides":null,"code":"{{ 'https://api.hubapi.com/crm/v4/objects/companies/' + ($('Resolve Company Id').first().json.company_id || '0') + '/associations/deals' }}","branches":[],"on_failure":"retryOnFail 2 tries at 1500 ms, neverError on the response, continueRegularOutput, alwaysOutputData: a bad or empty answer just means no deals.","say_it":"Deals come from the documented v4 associations endpoint, so 'open deal' means genuinely attached, not a search hit.","next":["Read Associated Deals"]},{"step":8,"name":"Read Associated Deals","type":"HTTP Request","what":"POST https://api.hubapi.com/crm/v3/objects/deals/batch/read with up to 20 of those deal ids, asking for dealname, dealstage, pipeline, amount, closedate and hubspot_owner_id.","why":"The association call only returns ids; the stage is needed to know which deals are still open.","in":"Get Company Deal Associations results (toObjectId or id), first 20.","out":"results[] of deals with properties.","decides":null,"code":"inputs: ((($('Get Company Deal Associations').first().json) || {}).results || []).slice(0, 20).map(r =\u003e ({ id: String(r.toObjectId || r.id) }))","branches":[],"on_failure":"retryOnFail 2 tries at 1500 ms, neverError, continueRegularOutput, alwaysOutputData. With no ids HubSpot rejects the empty batch, which simply yields no results.","say_it":"A batch read turns the associated deal ids into stages and amounts in one call.","next":["List HubSpot Owners"]},{"step":9,"name":"List HubSpot Owners","type":"HTTP Request","what":"GET https://api.hubapi.com/crm/v3/owners/?limit=100. One call per sync returning all owners with id, name and email.","why":"A raw owner id means nothing to a rep at a booth; this lets Build CRM Context print a person's name. On a free portal with a handful of owners, one list call beats a lookup per id.","in":"Nothing from the payload.","out":"results[] of owners (id, firstName, lastName, email).","decides":null,"code":"GET https://api.hubapi.com/crm/v3/owners/?limit=100","branches":[],"on_failure":"retryOnFail 2 tries at 1000 ms, neverError, continueRegularOutput, alwaysOutputData: without it the card shows no owner name but the sync continues.","say_it":"Owners are listed once per sync so the card can say who owns the lead by name.","next":["Resolve CRM Write"]},{"step":10,"name":"Resolve CRM Write","type":"Code","what":"The heart of 02: builds the complete write plan. Contact fields go through keep() so the HubSpot value wins; company name prefers HubSpot's company name; website becomes https://\u003cdomain\u003e. It builds 20 oak_* values, including the bare competitor enum and the one-way exclude flag, carries booth status and claim fields forward, drops closed deals, picks the owner (contact, else company, else 02A's pre-lookup owner) and derives customer_status. It also writes a meeting (title 'Oak booth scan - \u003cname\u003e (\u003cclassification\u003e)', start at scanned_at, 15 minutes) and a multi-section note: OAK BOOTH ENCOUNTER, PERSON, BOOTH NOTES, COMPANY RECORD, DECISION PROVENANCE, RECOMMENDED CONVERSATION [AI synthesis, not fact], VERIFIED COMPANY CONTEXT (quotes mentioning breach, ransom, cybercriminal, attack claim or reported security incident are filtered out).","why":"Every rule about what may be written, and what must be preserved, lives in one node that can be read top to bottom; the HubSpot nodes after it only execute the plan.","in":"Trigger payload, Resolve Company Id, Find Company by Domain, Find HubSpot Contact, Read Associated Deals.","out":"source (the original payload), existing_contact_id, contact_write, oak_properties (20 keys), meeting, note_body, needs_follow_up_task:false, crm_snapshot (portal, existing contact, company, owner_id, owner_source, customer_status, related_deals, open_deal_count, company_warnings).","decides":"Every value written to HubSpot, including which human-entered values survive and the oak_competitor_status enum.","code":"const keep=(current,incoming)=\u003eString(current==null?'':current).trim()||String(incoming==null?'':incoming).trim();\nconst competitorEnum=s.competitor?'confirmed':(['none','possible','confirmed'].indexOf(String(s.competitor_status||'none'))\u003e=0?String(s.competitor_status||'none'):'possible');\nconst boothStatus=String(ex.oak_booth_status||'').trim()||'scanned';const exclude=String(ex.oak_exclude_from_outreach||'').toLowerCase()==='true'||Boolean(s.competitor);\nconst ownerId=contactOwner||companyOwner||pre.owner_id||'';","branches":[],"on_failure":"No error settings; all lookups are filtered or wrapped in try/catch. A hard error would fail 02 and 01, sending the run to 99 with the ledger still 'accepted'.","say_it":"Resolve CRM Write builds the whole write plan in one place, and keep() is the one-line rule that a human in HubSpot always beats the scanner.","next":["Upsert Contact"]}]},{"name":"3. Write contact, tags and booth history","purpose":"Upsert on email so a second scan never duplicates, then the Oak properties, a meeting engagement and a readable note carrying full provenance.","nodes":[{"step":11,"name":"Upsert Contact","type":"HubSpot (contact upsert)","what":"HubSpot contact upsert keyed on the scan email, sending the keep()-resolved firstName, lastName, jobTitle, companyName, websiteUrl, leadStatus, lifeCycleStage and associatedCompanyId. resolveData is false, so it returns the lightweight response with vid and isNew.","why":"Upsert rather than create is the task's dedupe requirement: the same badge scanned twice updates one contact.","in":"Email from the trigger; everything else from $('Resolve CRM Write').first().json.contact_write.","out":"vid (contact id) and isNew.","decides":null,"code":"email: {{ $('When Called by Intake').first().json.email }}\nassociatedCompanyId: {{ $('Resolve CRM Write').first().json.contact_write.associated_company_id }}","branches":[],"on_failure":"retryOnFail 3 tries at 2000 ms, continueRegularOutput, alwaysOutputData. This is the one failure that means the lead is not in the CRM; Build CRM Context records 'Contact upsert failed' and sets lookup_status 'failed'.","say_it":"The contact is upserted on email, never created, so a returning visitor updates one record.","next":["Write Oak Properties API"]},{"step":12,"name":"Write Oak Properties API","type":"HTTP Request","what":"PATCH https://api.hubapi.com/crm/v3/objects/contacts/{vid, else existing_contact_id} with the Oak properties. Before sending it deletes oak_rule_summary and oak_score_breakdown (not provisioned) and prepends them to oak_decision_reasons as 'Rule fired: ...' and 'Score breakdown: ...', capped at 65,000 characters, then converts booleans to the strings 'true'/'false'. That leaves 18 properties in one call.","why":"A raw PATCH surfaces HubSpot's field-level validation error, which the HubSpot node would hide. The PATCH is all-or-nothing, so visibility matters.","in":"$('Resolve CRM Write').first().json.oak_properties and the contact id from Upsert Contact.","out":"The updated contact (id, properties) or an error item.","decides":null,"code":"delete p.oak_rule_summary; delete p.oak_score_breakdown; p.oak_decision_reasons = ('Rule fired: ' + rule + '\\nScore breakdown: ' + split + '\\n\\n' + (p.oak_decision_reasons || '')).slice(0, 65000);\nreturn Object.fromEntries(Object.entries(p).map(([k, v]) =\u003e [k, typeof v === 'boolean' ? String(v) : v]));","branches":[],"on_failure":"retryOnFail 3 tries at 1500 ms, continueRegularOutput, alwaysOutputData. No neverError here, so a 400 becomes an error item; Build CRM Context then adds 'Oak property write failed' and oak_properties_written is false.","say_it":"All Oak tags go in one PATCH whose result is asserted, because one invalid enum value once silently dropped the tier and score with it.","next":["Log Booth Conversation"]},{"step":13,"name":"Log Booth Conversation","type":"HubSpot (engagement: meeting)","what":"Creates a HubSpot meeting engagement associated to the contact vid, with the planned title, start and end time (15 minutes from scanned_at, formatted 'YYYY-MM-DD HH:MM:SS' in UTC) and the full note text as internal meeting notes.","why":"The booth encounter shows up on the contact timeline as a real interaction, which is what a rep scanning the timeline looks for.","in":"$('Resolve CRM Write').first().json.meeting and $('Upsert Contact').first().json.vid.","out":"The engagement (engagement.id).","decides":null,"code":"title: {{ $('Resolve CRM Write').first().json.meeting.title }}\ncontactIds: {{ $('Upsert Contact').first().json.vid }}","branches":[],"on_failure":"retryOnFail 3 tries at 2000 ms, continueRegularOutput, alwaysOutputData; a failure becomes the warning 'Booth conversation logging failed'.","say_it":"Every scan becomes a meeting on the HubSpot timeline, so the encounter is visible where reps already look.","next":["Create Associated Booth Note"]},{"step":14,"name":"Create Associated Booth Note","type":"HTTP Request","what":"POST https://api.hubapi.com/crm/v3/objects/notes with hs_timestamp = scanned_at and hs_note_body = the planned note with newlines turned into \u003cbr\u003e, associated to the contact with association type 202 (note to contact, HUBSPOT_DEFINED).","why":"A readable note carries the full provenance (rule fired, score breakdown, sources, suggested question) where anyone opening the contact will see it.","in":"Trigger scanned_at, $('Resolve CRM Write').first().json.note_body, contact id from Upsert Contact (else existing_contact_id).","out":"The note (id).","decides":null,"code":"associations: [{ to: { id: String($('Upsert Contact').first().json.vid || $('Resolve CRM Write').first().json.existing_contact_id) }, types: [{ associationCategory: 'HUBSPOT_DEFINED', associationTypeId: 202 }] }]","branches":[],"on_failure":"retryOnFail 3 tries at 1500 ms, continueRegularOutput, alwaysOutputData; a failure becomes 'Associated booth note creation failed'.","say_it":"The note is the audit trail in the CRM: what was said at the booth, which rule fired, and which claims have a source.","next":["Build CRM Context"]},{"step":15,"name":"Build CRM Context","type":"Code","what":"Assembles what 01 gets back. It collects warnings from every step (company warnings, contact upsert failed, no contact id, Oak property write failed, meeting failed, note failed, no company matched, no owner), resolves the owner id to a name and email from the owners list, builds the contact URL (0-1) and company URL (0-2), and returns the original payload with crm_context replaced.","why":"01 and the Slack card need one post-write truth: the real contact id and link, who owns it, and what went wrong, instead of the pre-write guess from 02A.","in":"Resolve CRM Write (source payload and crm_snapshot), Upsert Contact, Write Oak Properties API, Log Booth Conversation, Create Associated Booth Note, List HubSpot Owners.","out":"{...payload, crm_context:{lookup_status, portal_id, hubspot_contact_id, hubspot_contact_url, hubspot_company_url, is_net_new, existing_contact, company, company_match, company_created, company_enriched, owner_id, owner_name, owner_email, owner_source, customer_status, open_deal, open_deal_count, related_deals, oak_properties_written, booth_conversation_engagement_id, booth_note_id, follow_up_task_engagement_id:null, synced_at, warnings}}","decides":"lookup_status (complete | failed) and oak_properties_written, both from actual responses.","code":"lookup_status:contactId&&!up.error?'complete':'failed'\noak_properties_written:!tag.error&&Boolean(tag.id||tag.properties)","branches":[],"on_failure":"No error settings; every upstream result is read through a try/catch pick() helper, so failures arrive as warnings rather than exceptions.","say_it":"Build CRM Context reports what actually happened in HubSpot, from the responses, so a failed write shows on the Slack card instead of passing silently.","next":[]}]}],"decisions":[{"title":"Email is the contact key, domain is the company key","why":"The contact is upserted on email, never created, so a second scan of the same badge updates the same record. One company per domain keeps two people from one company on one record and lines up with the enrichment cache key."},{"title":"A human in HubSpot beats the scanner","why":"Five free-text fields go through keep(), where the existing HubSpot value wins and the scan only fills a blank. Lifecycle stage and lead status only default for a new contact, and the rep's booth status and claim fields are read off the contact and written straight back."},{"title":"The CRM beats enrichment, and industry is never guessed","why":"numberofemployees is written to the company only when HubSpot has none and the value did not come from HubSpot. HubSpot's industry is a fixed enumeration, so the resolved industry goes on the contact as oak_industry with oak_industry_source instead."},{"title":"Oak properties go through a raw PATCH so failures are visible","why":"All Oak properties go in one PATCH, which is all-or-nothing. When oak_competitor_status was sent as 'confirmed: Veza', HubSpot returned 400 INVALID_OPTION and dropped the tier, persona and score too. Now the enum gets a bare value and oak_properties_written is read from the response, not assumed."},{"title":"Deals via the v4 associations endpoint","why":"Open deals means deals genuinely attached to the company, read with GET /crm/v4/objects/companies/{id}/associations/deals then a v3 batch read, not a search that can lag. 02A accepts the looser search on the read side."},{"title":"No invented follow-up task","why":"needs_follow_up_task is hard-coded false. The only task creator in the whole system is the Snooze button in 06, so nothing makes up an SLA nobody agreed to."}],"questions":[{"q":"How do you avoid duplicate contacts?","a":"Upsert Contact upserts on email; 01 only calls 02 when email_valid is true, so there is always a key. A second scan updates the same contact and oak_scan_count goes up from 01's scan_count. The company is keyed on exact domain the same way."},{"q":"What if a rep already edited the contact in HubSpot?","a":"keep(current, incoming) returns the trimmed HubSpot value if there is one, else the scan value, for firstname, lastname, jobtitle, company and website. lifecyclestage and hs_lead_status keep the existing value and only default to 'lead' and 'NEW' for a brand-new contact. oak_booth_status, oak_claimed_by and oak_claimed_at are read off the contact and written back. The protection depends on Find HubSpot Contact finding the record: if that search fails or lags, keep() has nothing to compare against and the scanner values are sent."},{"q":"Why write the Oak fields with an HTTP PATCH instead of the HubSpot node?","a":"So HubSpot's field-level validation error comes back in the response and lands in crm_context.warnings. The PATCH is all-or-nothing, so one bad value loses every Oak field, which is exactly what happened with the decorated competitor enum. Build CRM Context now asserts oak_properties_written from the response body."},{"q":"Why 18 Oak properties when Resolve CRM Write builds 20?","a":"oak_rule_summary and oak_score_breakdown are not provisioned in the portal (00 retires them), so Write Oak Properties API deletes them from the body and prepends 'Rule fired: ...' and 'Score breakdown: ...' to oak_decision_reasons. Nothing is lost and there are fewer ways for the PATCH to fail."},{"q":"What does the rep get out of this workflow?","a":"In Slack, via the returned crm_context: the real contact link, the company link, the owner's name instead of an id, the relationship, the open deal and any warnings. In HubSpot: a meeting on the timeline and an associated note with booth notes, the rule that fired, the score breakdown, sourced company context and the suggested question."},{"q":"What happens when HubSpot fails mid-sync?","a":"Every call retries and continues on error, so the run always reaches Build CRM Context, which turns each failure into a warning line. lookup_status becomes 'failed' when no contact id came back or the upsert errored. 01 still stores and alerts the lead."},{"q":"Why not create a company when there is no domain?","a":"Resolve Company Write can still create from a company name alone, but domain is the dedupe key, so a name-only create can duplicate. When there is neither a domain nor a name, it plans 'skipped_no_identity', sends a harmless PATCH to company 0 and records a warning."}]},{"id":"02A","name":"Oak GTM - 02A CRM Context [sub-flow]","short":"CRM Context","lane":"enrich","one_breath":"02A is the read-only half of the HubSpot pair. 01 calls it for every classified scan right after the provisional 202, before enrichment and AI, and it asks HubSpot what it already knows about the company, the person and their open deals. It hands the same lead payload back with one crm_context object (relationship, owner, open deals, contact URL) and never changes a CRM record.","trigger":"Execute Workflow Trigger 'When Called for CRM Context' (input source: passthrough), called by 01's 'Read CRM Context' node with waitForSubWorkflow true","input":"The full lead payload from 01 after 'Prepare CRM Handoff' (the policy object removed). 02A only uses two fields from it: company_domain and email.","output":"The same payload spread back unchanged plus crm_context: lookup_status, portal_id, hubspot_contact_id, hubspot_contact_url, is_net_new, existing_contact, company (id, name, domain, industry, employees, annual_revenue, owner_id), company_match (domain_exact | not_found_by_domain), owner_id, owner_source (contact | company | none), customer_status (net_new | known_prospect | open_opportunity | customer), open_deal, open_deal_count, related_deals, warnings. No writes anywhere.","called_by":["01 Intake & Decision (node 'Read CRM Context')"],"calls":[],"node_count":6,"groups":[{"name":"Ungrouped","purpose":"The entry point: receives the lead payload from 01.","nodes":[{"step":1,"name":"When Called for CRM Context","type":"Execute Workflow Trigger","what":"Entry point of the sub-workflow. Input source is 'passthrough', so whatever item 01 sends arrives unchanged as one item, with no declared input schema. Every later node reads it by name with $('When Called for CRM Context').first().json.","why":"Passthrough means 01 does not have to map fields one by one, and the full lead payload can be spread straight back out at the end.","in":"The lead payload from 01's 'Read CRM Context' node (output of Prepare CRM Handoff: everything except the policy object).","out":"The same single item, untouched.","decides":null,"code":null,"branches":[],"on_failure":"A trigger does not fail on its own. The workflow's error workflow is 99, and because 01 waits for this sub-workflow, a hard error here would also fail 01's 'Read CRM Context' step.","say_it":"02A is a passthrough sub-workflow: 01 hands it the whole lead and gets the same lead back with a crm_context object added.","next":["Read HubSpot Portal"]}]},{"name":"Read CRM Context","purpose":"Reads portal, company, contact, owner and open-deal context before AI synthesis. No CRM records are changed.","nodes":[{"step":2,"name":"Read HubSpot Portal","type":"HTTP Request","what":"GET https://api.hubapi.com/integrations/v1/me using the HubSpot OAuth2 credential. The response carries portalId, the HubSpot account number. It is the first call so the portal id is available when the contact URL is built.","why":"Without the portal id, a record link cannot be built when HubSpot does not return one, and the Slack card's 'Open in HubSpot' link would point nowhere.","in":"Nothing from the payload; only the HubSpot credential (hubspotOAuth2Api 'HubSpot account').","out":"portalId (plus other account metadata).","decides":null,"code":"GET https://api.hubapi.com/integrations/v1/me","branches":[],"on_failure":"retryOnFail with maxTries 3 and 1500 ms between tries, then onError continueRegularOutput plus alwaysOutputData: the run continues with an error item and portal_id simply ends up null.","say_it":"The first call only fetches the portal id, so every HubSpot link the rep clicks opens the right account.","next":["Find Company by Domain"]},{"step":3,"name":"Find Company by Domain","type":"HubSpot (company searchByDomain)","what":"HubSpot node, resource company, operation searchByDomain, limit 1, on the payload's company_domain (empty string if missing). It asks for name, domain, industry, numberofemployees, annualrevenue, hubspot_owner_id and lifecyclestage. Domain is the company identity in this system, so this is an exact domain match, not a fuzzy name search.","why":"A HubSpot headcount is the record of truth in 04 (confidence 1.0) and a HubSpot industry is resolved first, so this lookup directly changes the size band and score downstream.","in":"$('When Called for CRM Context').first().json.company_domain","out":"Zero or one company item with companyId/id and properties.","decides":null,"code":"domain: {{ $('When Called for CRM Context').first().json.company_domain || '' }}","branches":[],"on_failure":"retryOnFail 3 tries at 1500 ms, continueRegularOutput and alwaysOutputData: a miss or an error produces an item with no id, which Build CRM Context reads as company not found.","say_it":"Company is matched on exact domain, because domain is the one company key the whole system agrees on.","next":["Find Contact by Email"]},{"step":4,"name":"Find Contact by Email","type":"HubSpot (contact search)","what":"HubSpot contact search, limit 1, one filter: email equals the scan email. If the scan has no valid email it searches for the sentinel '__missing_email__', which safely matches nothing. It returns email, firstname, lastname, jobtitle, company, lifecyclestage, hs_lead_status, hubspot_owner_id, createdate and hs_object_id.","why":"The contact's lifecycle stage is what decides customer vs prospect, and the contact owner is the preferred owner. Without it the card could not say 'already a customer' or name who owns the relationship.","in":"$('When Called for CRM Context').first().json.email","out":"Zero or one contact item with id and properties.","decides":null,"code":"value: {{ $('When Called for CRM Context').first().json.email || '__missing_email__' }}","branches":[],"on_failure":"retryOnFail 3 tries at 1500 ms, continueRegularOutput and alwaysOutputData, so a failed search reads as no contact (net_new).","say_it":"The contact lookup is email-exact, and a missing email searches a sentinel value so it can never accidentally match someone.","next":["Find Deals by Company"]},{"step":5,"name":"Find Deals by Company","type":"HubSpot (deal search)","what":"HubSpot deal search, up to 10 results, filter associations.company equals the company id from Find Company by Domain, sorted by createdate DESCENDING. With no company it searches '__no_company__', which finds nothing. It returns dealname, dealstage, pipeline, amount, closedate and hubspot_owner_id.","why":"An open deal changes the conversation (the rep should not pitch a live opportunity from scratch) and is shown on the card and given to the AI prompt.","in":"$('Find Company by Domain').first().json.companyId or .id","out":"Up to 10 deal items, newest first.","decides":null,"code":"value: {{ $('Find Company by Domain').first().json.companyId || $('Find Company by Domain').first().json.id || '__no_company__' }}","branches":[],"on_failure":"retryOnFail 3 tries at 1500 ms, continueRegularOutput and alwaysOutputData. The associations.company filter is index-backed, so a deal created seconds ago can be missed; that is accepted on the read side (02 uses the v4 associations endpoint instead).","say_it":"Deals are read with a cheap search here because this is context for the AI, not a write; the write side uses the authoritative associations API.","next":["Build CRM Context"]},{"step":6,"name":"Build CRM Context","type":"Code","what":"Collects the four lookups and derives what downstream actually branches on. It keeps only items with a real id, takes the first company and the first contact, drops deals whose stage is closedwon or closedlost, picks owner_id from the contact owner falling back to the company owner, and maps the contact's lifecycle stage to customer_status. It builds the contact URL (the one HubSpot returned, else app.hubspot.com/contacts/\u003cportal\u003e/record/0-1/\u003cid\u003e) and returns the original payload plus one crm_context object.","why":"Downstream nodes should not have to understand four raw HubSpot responses. One normalised object is what 04 (HubSpot headcount first), 05 (prompt context), 02 (owner fallback) and 03 (card) read.","in":"The trigger payload, Read HubSpot Portal, Find Company by Domain, Find Contact by Email, Find Deals by Company (all read by node name).","out":"{...payload, crm_context:{lookup_status:'complete', portal_id, hubspot_contact_id, hubspot_contact_url, is_net_new, existing_contact, company, company_match, owner_id, owner_source, customer_status, open_deal, open_deal_count, related_deals, warnings:[]}}","decides":"customer_status (net_new | customer | open_opportunity | known_prospect), owner_id and owner_source (contact | company | none), and which deals count as open.","code":"const closed=['closedwon','closedlost'];\nconst openDeals=deals.filter(d=\u003e!closed.includes(String((d.properties&&d.properties.dealstage)||'').toLowerCase()));\nconst ownerId=contactOwner||companyOwner||'';\nconst customerStatus=!contact?'net_new':lifecycle==='customer'?'customer':lifecycle==='opportunity'?'open_opportunity':'known_prospect';","branches":[],"on_failure":"No retry or continue settings; every lookup is read through a try/catch helper or filtered for an id, so it is hard to make it throw. Note: lookup_status is always 'complete' and warnings always [], so a HubSpot outage is indistinguishable from a genuinely net_new person here.","say_it":"Build CRM Context turns four raw HubSpot answers into the three facts the rest of the system branches on: relationship, owner and open deals.","next":[]}]}],"decisions":[{"title":"Read before you reason","why":"An existing owner, an open deal or a customer relationship changes the booth conversation more than any public fact, so the CRM is read before 04 resolves headcount (HubSpot headcount wins at confidence 1.0) and before 05 writes the opening question."},{"title":"Reads and writes live in different workflows","why":"02A only issues one GET and three searches; every automated write is in 02, after the decision. A lookup path that cannot mutate a record is the easiest way to keep trust in the automation."},{"title":"Reading the CRM is never gated","why":"A HubSpot read costs nothing, so even an out_of_scope or competitor scan gets it. The cost gates live in 04 (paid Brave search) and 05 (Gemini)."},{"title":"Looser read, strict write","why":"Deals come from a deal search filtered on associations.company, which is index-backed and can miss a deal created seconds ago. That is acceptable for AI context; 02 uses the authoritative v4 associations endpoint because a write must not be wrong."},{"title":"Every lookup soft-fails independently","why":"All four HubSpot calls retry 3 times at 1.5s, continue on error and always output data, and Build CRM Context filters every result for a real id. A failed or empty lookup simply reads as not found, so HubSpot trouble never stops the booth pipeline."}],"questions":[{"q":"Why a separate read workflow instead of reading inside 02?","a":"02 runs at the very end, after AI. Enrichment (04) needs a HubSpot headcount and industry to rank sources, and the AI (05) needs the owner, relationship and open deal to write a sensible question, so the CRM has to be read earlier. Splitting it out also makes it structurally impossible for the lookup path to change a record."},{"q":"How do you decide customer vs prospect?","a":"From the contact's lifecycle stage in Build CRM Context: no contact is net_new, lifecyclestage 'customer' is customer, 'opportunity' is open_opportunity, anything else is known_prospect. Owner is the contact owner, else the company owner, and owner_source records which one answered."},{"q":"What happens if HubSpot has no record?","a":"That is the normal net_new outcome, not an error. company_match is not_found_by_domain, owner_source is none, open_deal_count is 0, and 02 creates the company and contact later if the scan has a valid email."},{"q":"What happens if HubSpot is down?","a":"Each call retries three times 1.5 seconds apart and then continues with an error item. Build CRM Context ignores anything without an id, so the run continues. The honest caveat: lookup_status is hard-coded to 'complete' and warnings to [], so an outage currently looks exactly like a net_new person; 02 re-reads the contact itself before writing, so the CRM write is not affected."},{"q":"Why read the portal id at all?","a":"So the Slack card's HubSpot link opens the right portal. When HubSpot does not return a contact URL, Build CRM Context builds https://app.hubspot.com/contacts/\u003cportalId\u003e/record/0-1/\u003ccontactId\u003e."},{"q":"Why is the deal search acceptable here when 02 does it differently?","a":"The associations.company search is index-backed, so a deal created moments ago can be missed. On the read side that only thins the AI's context. On the write side 02 uses GET /crm/v4/objects/companies/{id}/associations/deals plus a batch read, which is authoritative."}]},{"id":"03","name":"Oak GTM - 03 Slack Alerts [sub-flow]","short":"Slack Alerts","lane":"write","one_breath":"03 turns a finished decision into a Slack card a rep can act on in ten seconds. 01 calls it once tier, CRM context and AI synthesis are settled, and 06 calls it again when a rep reclassifies a lead; it looks the channel up in the active policy, builds the card in a fixed order, threads a returning visitor under their last alert (or reposts them in the new channel when their classification moved), attaches the buttons that tier is entitled to, and hands back a delivery receipt of what Slack accepted or rejected.","trigger":"Execute Workflow Trigger 'When Called by Sync' (passthrough); active version 3171f36c","input":"The full decision payload for one scan: classification, score and breakdown, routing, CRM context, enrichment and evidence, booth notes, opening question, listen-fors, repeat-scan fields, and (from 06 only) override_banner.","output":"One delivery receipt (delivered_count, failed_count, channel, threaded, broadcast, moved_from_channel (only when a repeat changed channel), thread_anchor_recorded, owner_dm_requested, owner_mapped, deliveries[], warnings[]). Side effects: Slack posts (channel card, thread reply or moved pointer, owner DM) and an upsert of last_slack_channel and last_slack_ts on oak_encounters.","called_by":["01 Intake & Decision (Notify Slack)","06 Slack Actions (Repost Card via Slack Alerts)"],"calls":[],"node_count":13,"groups":[{"name":"Ungrouped","purpose":"The trigger that receives the decided lead.","nodes":[{"step":1,"name":"When Called by Sync","type":"Execute Workflow Trigger (passthrough)","what":"The entry point. It accepts whatever the caller sends, unchanged (inputSource: passthrough), so 03 has no declared input schema to drift out of date. Every later Code node reads the original lead back with $('When Called by Sync').first().json instead of trusting the item that happens to flow in, so no intermediate node can lose a field another node needs.","why":"03 is a sub-workflow with two callers (01 after a scan, 06 after a rep reclassifies). Passthrough means both can hand over the full decision object and the card builder sees exactly what was decided.","in":"The full decision payload from 01 Notify Slack (or the rebuilt payload from 06 Repost Card via Slack Alerts): classification, score, score_breakdown, routing, crm_context, company_enrichment, employee_resolution, company_size_band, person_evidence, company_evidence, notes_from_booth, opening_question, listen_for, urgency_evidence, persona, persona_source, decision_reasons, repeat fields (repeat_scan, scan_count, notification_mode, previous_slack_ts, previous_slack_channel, classification_changed, prior_classification, notes_changed, material_change, previous_notes_from_booth), injection_suspected, personal_email, data_quality, and from 06 only override_banner.","out":"The same object, one item.","decides":null,"code":null,"branches":[],"on_failure":"Nothing to fail here; the workflow's settings.errorWorkflow is 99, so any later unhandled error posts a 03 alert (\"HubSpot is up to date but nobody was notified\") to #oak-revops.","say_it":"03 takes the whole decided lead as-is and every step reads it back from the trigger by name, so nothing gets lost between steps.","next":["Load Routing Policy"]}]},{"name":"Routing Policy","purpose":"Reads the channel map from the active policy, builds the card, and attaches the buttons a classification is entitled to; none for out of scope.","nodes":[{"step":2,"name":"Load Routing Policy","type":"Data Table get (oak_policies)","what":"Reads the one row of oak_policies where status = active (limit 1, table referenced by name). That row's document_json holds the notifications block (channel and owner_dm per classification, plus owner_overrides) and the slack block (default_channel, owner_directory). Today the active row is oak-event-v5: tier_1 booth-hot with owner_dm true, matched booth-matched, needs_review booth-review, competitor_intel competitive-intel, out_of_scope booth-out-of-scope, ops_alerts oak-revops.","why":"This is what makes channels table-driven: moving Tier 1 to another channel is a Data Table edit, not a workflow deploy.","in":"No input fields; filter status = active.","out":"One policy row (version, status, document_json string).","decides":"Which policy row is in force.","code":null,"branches":[],"on_failure":"alwaysOutputData plus onError continueRegularOutput: if the read fails or finds nothing the flow still continues with an empty item, and Resolve Slack Targets falls back to the routing 01 already resolved, then to slack.default_channel, then to the hard default booth-review.","say_it":"Channels live in the active policy row, so changing where a tier posts is a data edit, not a redeploy.","next":["Resolve Slack Targets"]},{"step":3,"name":"Resolve Slack Targets","type":"Code","what":"The heart of 03, in three jobs. (1) Targets: channel precedence is routing.channel from 01, then notifications[classification].channel, then slack.default_channel, then booth-review; out_of_scope deliberately gets an empty channel here. Owner DM is requested when routing or the policy says owner_dm true and the lead is not out of scope; the HubSpot owner id is mapped to a Slack user through notifications.owner_overrides or slack.owner_directory, and both maps are empty {} in oak-event-v5, so every Tier 1 owner DM is currently skipped with a warning. (2) Threading: a repeat is threaded only when 01 set notification_mode repeat_thread or repeat_escalation, a previous ts and channel exist, AND the lead still belongs in that card's channel. The anchor is a Slack channel id and the policy speaks in names, so the old channel is looked up by the classification the card was posted for: rep_override when it stands on this scan (06 reposted the card there), else prior_classification. Same channel: the target is swapped for previous_slack_channel and reply_broadcast is on so the reply also shows in the channel. Different channel (moved): a new card goes to the new classification's channel, plus one extra item (delivery_role move_note, channel_thread, reply_broadcast false) posting a one-line pointer in the old thread that never names a private channel. Unknown old classification falls back to threading. (3) The card, in fixed order, each section a divider plus bold title plus body: header (tier emoji and label, name, and the one blocker: '- confirm company size' or '- size below ICP, needs a call', capped at 150 chars), Returning visitor line, @here lines, Prospect information, Company information, Companies matching this name (up to 3 labelled name-only candidates), personal email warning, Booth notes verbatim (plus injection warning and Booth notes last time), Why this lead with the Score line and 'Decided by', Do at the booth (not for out of scope), links row (Open HubSpot, Company site), Missing from the scan.","why":"One node owns routing, threading and rendering so the card and the plan cannot disagree. Every user-supplied string passes through esc() (& \u003c \u003e become entities), so a booth note cannot inject \u003c!channel\u003e or break the block JSON.","in":"The lead from When Called by Sync and document_json from Load Routing Policy.","out":"One item per target (channel and/or dm), each carrying the whole lead plus delivery_kind (channel_new, channel_thread or dm), target {kind,target,role}, plan {mode, channel, owner_dm, owner_mapped, use_thread, thread_ts, thread_channel, reply_broadcast, target_count}, slack_blocks (JSON string), slack_text (fallback) and routing_warnings. With no target at all: one item with delivery_kind 'none' and a skip_reason. A moved repeat appends one move_note item, and plan gains moved and moved_from_channel.","decides":"Channel, whether to DM the owner, whether to thread, and every line of the card. It decides nothing about tier or score.","code":"const configuredChannel=clean(routing.channel||(notif[cls]||{}).channel||sl.default_channel||'booth-review');\nconst channel=cls==='out_of_scope'?'':configuredChannel;\nconst repeatAnchor=Boolean(prevTs&&prevCh&&(mode==='repeat_thread'||mode==='repeat_escalation'));\nconst anchorCls=String((s.rep_override&&s.rep_override===cls)?cls:(s.prior_classification||''));\nconst anchorChannel=anchorCls?clean((notif[anchorCls]||{}).channel||''):'';\nconst moved=Boolean(repeatAnchor&&anchorChannel&&anchorChannel!==configuredChannel);\nconst useThread=repeatAnchor&&!moved;\nif(cls==='tier_1')blocks.push({type:'context',elements:[{type:'mrkdwn',text:'\u003c!here\u003e *Hot lead at the booth now* - whoever is free, take it.'}]});\nif(repeatScan&&s.material_change===true&&cls!=='tier_1'&&cls!=='out_of_scope')blocks.push({type:'context',elements:[{type:'mrkdwn',text:'\u003c!here\u003e *Something changed on a returning visitor* - not a new lead, but worth another look.'}]});","branches":[],"on_failure":"No onError setting: a throw fails the execution and 99 reports a 03 failure. The code is defensive (policy JSON parse in try/catch, every field defaulted), so in practice the risky calls are Slack's, downstream.","say_it":"Resolve Slack Targets picks the channel from the policy, decides whether a returning visitor threads or moves to a new channel, and renders a card where every line names its source.","next":["Enforce Out-of-Scope Delivery"]},{"step":4,"name":"Enforce Out-of-Scope Delivery","type":"Code (run once for each item)","what":"The quiet route. Anything that is not out_of_scope passes through untouched. For out_of_scope it sets the channel to routing.channel or, if routing is absent, the hard default booth-out-of-scope; deletes every block of type actions (buttons and the links row) and any section containing '*Do at the booth*'; sets target_count 1, clears skip_reason and makes it a channel_new post (or channel_thread for a threaded repeat).","why":"Resolve Slack Targets already leaves coaching and links off an out-of-scope card; this is a belt-and-braces guard so no future edit can leak a call to action onto the audit channel. Result: out-of-scope visits get a record, not a ping. Note for a 06 'Not a fit' repost: 06 deletes routing, so the channel here is the hard-coded 'booth-out-of-scope' (which matches the policy today), not a policy lookup.","in":"Each item from Resolve Slack Targets.","out":"Same items; for out_of_scope a rewritten delivery_kind, target {kind:'channel', target:\u003cchannel\u003e, role:'classification_channel'}, plan.channel and stripped slack_blocks.","decides":"Out of scope is posted, quietly, with no buttons and no coaching.","code":"const channel=String((x.routing||{}).channel||'booth-out-of-scope').replace(/^#/,'');\nparsed.blocks=(parsed.blocks||[]).filter(function(b){if(b.type==='actions')return false;return !(b.type==='section'&&/\\*Do at the booth\\*/.test(String(((b.text||{}).text)||'')));});","branches":[],"on_failure":"No onError setting; a throw would fail the run and alert via 99. The JSON.parse of slack_blocks is wrapped in try/catch.","say_it":"Out-of-scope leads still get a card for the audit trail, but this node guarantees it has no mention, no coaching and no buttons.","next":["Attach Core Action Buttons"]},{"step":5,"name":"Attach Core Action Buttons","type":"Code (run once for each item)","what":"A move_note item from Resolve Slack Targets passes straight through with no banner and no buttons. Then, if 06 passed override_banner, it inserts that one context line (block_id oak_override_banner) directly under the header, e.g. '*Moved from Needs review to Tier 1* by @rep - confirmed renewal.'. Out of scope returns here with the banner only. For everything else it removes any old action rows and, only when the n8n variable OAK_SLACK_ACTIONS_ENABLED is 'true', adds rows by classification. competitor_intel: oak_core_actions = Why this score? | Flag for competitive intel | False alarm. needs_review: core = Claim | Why this score?; triage row oak_triage_actions = Promote to Tier 1 | Matched | Not a fit; status = Mark met | Meeting booked; more = Add note | Send to owner | Snooze. matched: core = Claim | Why; status = Mark met | Meeting booked | Not a fit; more = Add note | Send to owner | Snooze | Promote to Tier 1. tier_1: same as matched without Promote. Claim appears only when crm_context.hubspot_contact_id exists. Each button value is JSON {event_person_key, scan_id, hubspot_contact_id, classification} (Mark met and Meeting booked add status). Finally it de-duplicates action_ids with a __2 suffix.","why":"Buttons are what closes the loop in Slack, and which buttons a card gets depends on what question that card asks. The triage row exists because a review card asks only 'where does this lead
