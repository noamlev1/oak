<title>Oak Workflow Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400;1,6..72,500&display=swap">
<style>
:root {
  --bg: #edf0f3;
  --band: #e4e8ed;
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --ink: #111a24;
  --ink-2: #435060;
  --ink-3: #6b7886;
  --line: #d6dde5;
  --line-strong: #aeb9c5;
  --accent: #2a47ab;
  --accent-ink: #ffffff;
  --accent-soft: #e2e8f8;
  --cue: #fbe7a1;
  --cue-ink: #2b2206;
  --cue-label: #8a6a00;
  --code-bg: #121b26;
  --code-ink: #dbe4ee;
  --bar-bg: rgba(237, 240, 243, 0.9);
  --scrim: rgba(17, 26, 36, 0.42);
  --fail: #b8372c;
  --ok: #1f7a4a;
  --l-intake: #2463c9;
  --l-enrich: #7445c2;
  --l-write: #0d8069;
  --l-rep: #b75a14;
  --l-ops: #5a6778;

  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --f-disp: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --f-voice: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;

  --bar-h: 58px;
  --rail-w: 50px;
  --gutter: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1218;
    --band: #111922;
    --surface: #141d27;
    --surface-2: #19232e;
    --ink: #e3e9ef;
    --ink-2: #a9b5c2;
    --ink-3: #7c8998;
    --line: #243140;
    --line-strong: #3a4a5b;
    --accent: #8ea8ff;
    --accent-ink: #0c1218;
    --accent-soft: #1b2645;
    --cue: #4a3c0c;
    --cue-ink: #fbeebb;
    --cue-label: #e0bb4a;
    --code-bg: #090e13;
    --code-ink: #d6dfe8;
    --bar-bg: rgba(12, 18, 24, 0.88);
    --scrim: rgba(0, 0, 0, 0.6);
    --fail: #f07b6f;
    --ok: #5cc98d;
    --l-intake: #6d9ef2;
    --l-enrich: #ab8bea;
    --l-write: #45c2a4;
    --l-rep: #eb944f;
    --l-ops: #97a5b5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1218;
  --band: #111922;
  --surface: #141d27;
  --surface-2: #19232e;
  --ink: #e3e9ef;
  --ink-2: #a9b5c2;
  --ink-3: #7c8998;
  --line: #243140;
  --line-strong: #3a4a5b;
  --accent: #8ea8ff;
  --accent-ink: #0c1218;
  --accent-soft: #1b2645;
  --cue: #4a3c0c;
  --cue-ink: #fbeebb;
  --cue-label: #e0bb4a;
  --code-bg: #090e13;
  --code-ink: #d6dfe8;
  --bar-bg: rgba(12, 18, 24, 0.88);
  --scrim: rgba(0, 0, 0, 0.6);
  --fail: #f07b6f;
  --ok: #5cc98d;
  --l-intake: #6d9ef2;
  --l-enrich: #ab8bea;
  --l-write: #45c2a4;
  --l-rep: #eb944f;
  --l-ops: #97a5b5;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--accent); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- top bar ---------- */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--bar-bg);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.bar-in {
  max-width: 1240px;
  margin: 0 auto;
  padding-inline: var(--gutter);
  min-height: var(--bar-h);
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  text-decoration: none;
  color: var(--ink);
  font-family: var(--f-disp);
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.01em;
  white-space: nowrap;
  min-height: 44px;
}
.brand-mark {
  display: inline-grid;
  place-items: center;
  min-width: 34px;
  height: 30px;
  padding: 0 6px;
  border-radius: 5px;
  background: var(--ink);
  color: var(--bg);
  font-size: 14px;
  letter-spacing: 0.02em;
}
.brand-sub { font-weight: 500; color: var(--ink-2); }
.pick {
  flex: 0 1 280px;
  min-width: 0;
  height: 40px;
  padding: 0 32px 0 12px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--surface);
  font-size: 15px;
  appearance: none;
  -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 17px) 17px, calc(100% - 12px) 17px;
  background-size: 5px 5px;
  background-repeat: no-repeat;
  cursor: pointer;
  text-overflow: ellipsis;
}
.spacer { flex: 1; }
.tbtn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  min-width: 44px;
  padding: 0 12px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--surface);
  cursor: pointer;
  white-space: nowrap;
  font-size: 14.5px;
}
.tbtn svg { width: 17px; height: 17px; flex: none; }
.tbtn:hover { border-color: var(--ink-3); }
.kbd {
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--ink-3);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 0 5px;
}
.switch {
  width: 30px;
  height: 18px;
  border-radius: 9px;
  background: var(--line-strong);
  position: relative;
  flex: none;
  transition: background 0.15s;
}
.switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--surface);
  transition: transform 0.15s;
}
.tbtn[aria-pressed="true"] { border-color: var(--accent); }
.tbtn[aria-pressed="true"] .switch { background: var(--accent); }
.tbtn[aria-pressed="true"] .switch::after { transform: translateX(12px); }

/* ---------- page shell ---------- */
.wrap {
  max-width: 1240px;
  margin: 0 auto;
  padding-inline: var(--gutter);
  padding-block: 28px 96px;
}
.shell { display: block; }
.side { display: none; }
@media (min-width: 1100px) {
  .shell.has-side {
    display: grid;
    grid-template-columns: 250px minmax(0, 800px);
    gap: 48px;
    justify-content: center;
  }
  .shell.has-side .side { display: block; }
}
.side-in {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 20px);
  max-height: calc(100vh - var(--bar-h) - 40px);
  overflow-y: auto;
  padding-right: 6px;
  font-size: 13.5px;
}
.side-h {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 18px 0 6px;
  font-weight: 600;
}
.side-h:first-child { margin-top: 0; }
.side ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.side a {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr);
  gap: 4px;
  padding: 4px 8px;
  border-radius: 4px;
  color: var(--ink-2);
  text-decoration: none;
  line-height: 1.35;
}
.side a:hover { background: var(--surface); color: var(--ink); }
.side a.cur { background: var(--accent-soft); color: var(--ink); }
.side a .n { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); padding-top: 1px; }

/* ---------- shared bits ---------- */
.eyebrow {
  font-size: 12px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 600;
}
.lane-dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 2px;
  background: var(--lane, var(--ink-3));
  flex: none;
}
[data-lane="intake"] { --lane: var(--l-intake); }
[data-lane="enrich"] { --lane: var(--l-enrich); }
[data-lane="write"] { --lane: var(--l-write); }
[data-lane="rep"] { --lane: var(--l-rep); }
[data-lane="ops"] { --lane: var(--l-ops); }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 30px;
  padding: 2px 10px;
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  background: var(--surface);
  color: var(--ink);
  font-size: 14px;
  text-decoration: none;
}
a.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip .cid { font-family: var(--f-mono); font-weight: 600; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.voice {
  font-family: var(--f-voice);
  font-style: italic;
}
.hl {
  background: linear-gradient(to bottom, transparent 0.12em, var(--cue) 0.12em, var(--cue) calc(100% - 0.06em), transparent calc(100% - 0.06em));
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  color: var(--cue-ink);
  padding: 0 0.18em;
}

/* ---------- map view ---------- */
.hero { max-width: 64ch; display: grid; gap: 12px; margin-bottom: 26px; }
.hero h1 {
  font-family: var(--f-disp);
  font-weight: 700;
  font-size: clamp(30px, 5vw, 44px);
  line-height: 1.04;
  letter-spacing: -0.005em;
}
.hero p { color: var(--ink-2); font-size: 17px; }
.status {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 20px;
  font-size: 14px;
  color: var(--ink-2);
}
.status b { font-family: var(--f-mono); font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.mapbox {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 10px;
}
.mapbox svg { display: block; width: 100%; height: auto; }
@media (max-width: 759px) { .mapbox, .legend { display: none; } }
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 22px;
  font-size: 13px;
  color: var(--ink-2);
  margin-bottom: 36px;
}
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend svg { width: 26px; height: 12px; }

.band { fill: var(--band); }
.lane-t { font: 600 11px var(--f-body); letter-spacing: 0.08em; fill: var(--ink-2); text-transform: uppercase; }
.mnode { cursor: pointer; }
.mnode .mbox { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.2; }
.mnode:hover .mbox, .mnode:focus-visible .mbox { stroke: var(--accent); stroke-width: 2; }
.mnode:focus-visible { outline: none; }
.mnode.missing .mbox { stroke-dasharray: 4 3; fill: var(--surface-2); }
.mnode.missing .mname { fill: var(--ink-3); }
.mid { font: 600 13px var(--f-mono); }
.mname { font: 500 12.5px var(--f-body); fill: var(--ink); }
.mcount { font: 400 11px var(--f-mono); fill: var(--ink-3); text-anchor: end; }
.ext .ebox { fill: var(--bg); stroke: var(--ink-3); stroke-dasharray: 3 3; }
.ext text { font: 500 12px var(--f-body); fill: var(--ink-2); text-anchor: middle; }
.edge { fill: none; stroke: var(--ink-3); stroke-width: 1.5; }
.edge.ext { stroke-dasharray: 5 4; }
.ahead { fill: var(--ink-3); }
.elabel { font: 400 11.5px var(--f-body); fill: var(--ink-2); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.ebadge circle { fill: var(--accent); }
.ebadge text { font: 600 11px var(--f-mono); fill: var(--accent-ink); text-anchor: middle; }
.faildot { fill: var(--fail); stroke: var(--surface); stroke-width: 2; }
svg.focus .edge, svg.focus .ebadge, svg.focus .elabel { opacity: 0.22; }
svg.focus .edge.hot, svg.focus .ebadge.hot, svg.focus .elabel.hot { opacity: 1; }
svg.focus .edge.hot { stroke: var(--accent); stroke-width: 2; }

.lanes { display: grid; gap: 30px; }
.lanes h2 {
  font-family: var(--f-disp);
  font-weight: 600;
  font-size: 22px;
  margin-bottom: 4px;
}
.lane-h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.lane-h .lane-dot { width: 11px; height: 11px; }
.wf-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
@media (min-width: 900px) { .wf-list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.wf-row {
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr);
  gap: 12px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink);
  text-decoration: none;
  height: 100%;
}
.wf-row:hover { border-color: var(--accent); }
.wf-row.missing { background: var(--surface-2); border-style: dashed; }
.wf-id {
  font-family: var(--f-mono);
  font-weight: 600;
  font-size: 20px;
  line-height: 1.2;
  color: var(--lane);
}
.wf-main { display: grid; gap: 4px; min-width: 0; }
.wf-name { font-weight: 600; font-size: 16.5px; line-height: 1.3; }
.wf-name small { font-weight: 400; font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); margin-left: 6px; }
.wf-blurb { color: var(--ink-2); font-size: 14.5px; }
.wf-edges { display: grid; gap: 2px; font-size: 13.5px; color: var(--ink-2); }
.wf-edges b { font-weight: 600; color: var(--ink-3); font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; margin-right: 6px; }

/* ---------- workflow view ---------- */
.crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-3); margin-bottom: 14px; }
.crumb a { color: var(--ink-2); text-decoration: none; min-height: 32px; display: inline-flex; align-items: center; }
.crumb a:hover { color: var(--accent); }
.wf-title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
.wf-title .big-id {
  font-family: var(--f-mono);
  font-weight: 600;
  font-size: clamp(34px, 6vw, 48px);
  line-height: 1;
  color: var(--lane);
}
.wf-title h1 {
  font-family: var(--f-disp);
  font-weight: 700;
  font-size: clamp(28px, 4.6vw, 40px);
  line-height: 1.05;
}
.canvas-name { font-family: var(--f-mono); font-size: 13px; color: var(--ink-3); margin-bottom: 22px; overflow-wrap: anywhere; }
.breath { margin-bottom: 26px; max-width: 66ch; }
.breath .k { display: block; margin-bottom: 8px; color: var(--cue-label); }
.breath p { font-size: clamp(20px, 2.6vw, 24px); line-height: 1.45; }
.facts {
  display: grid;
  grid-template-columns: 112px minmax(0, 1fr);
  gap: 12px 18px;
  margin: 0 0 40px;
  padding: 18px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  font-size: 15px;
}
.facts dt { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding-top: 3px; }
.facts dd { margin: 0; color: var(--ink); max-width: 66ch; }
@media (max-width: 560px) {
  .facts { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .facts dd { margin-bottom: 10px; }
}
.talk-note { display: none; }
.sec-h {
  font-family: var(--f-disp);
  font-weight: 600;
  font-size: 26px;
  line-height: 1.15;
  margin: 0 0 18px;
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
}
.sec-h small { font-family: var(--f-body); font-weight: 400; font-size: 14px; color: var(--ink-3); }

/* rail */
.rail { position: relative; }
.rail::before {
  content: "";
  position: absolute;
  left: calc(var(--rail-w) / 2 - 1px);
  top: 8px;
  bottom: 24px;
  width: 2px;
  background: var(--line-strong);
}
.group { position: relative; margin-bottom: 10px; }
.g-head {
  position: relative;
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  padding: 10px 0 14px;
}
.g-mark {
  justify-self: center;
  margin-top: 5px;
  width: 14px;
  height: 14px;
  background: var(--bg);
  border: 2px solid var(--ink-2);
  transform: rotate(45deg);
  position: relative;
  z-index: 1;
}
.g-name { font-family: var(--f-disp); font-weight: 600; font-size: 20px; line-height: 1.25; }
.g-name .g-range { font-family: var(--f-mono); font-weight: 400; font-size: 12.5px; color: var(--ink-3); margin-left: 8px; }
.g-purpose { color: var(--ink-2); font-size: 15px; margin-top: 2px; max-width: 64ch; }
.node {
  position: relative;
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  margin-bottom: 14px;
  scroll-margin-top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 14px);
}
.step {
  justify-self: center;
  position: relative;
  z-index: 1;
  min-width: 34px;
  height: 28px;
  margin-top: 14px;
  padding: 0 6px;
  display: grid;
  place-items: center;
  font-family: var(--f-mono);
  font-weight: 600;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  background: var(--surface);
  border: 1.5px solid var(--line-strong);
  border-radius: 5px;
  color: var(--ink);
  text-decoration: none;
}
.step.fork { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.card {
  min-width: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 16px 18px 16px;
  display: grid;
  gap: 12px;
  transition: box-shadow 0.25s, border-color 0.25s;
}
.node.flash .card { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.n-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.n-name { font-family: var(--f-disp); font-weight: 600; font-size: 20px; line-height: 1.25; overflow-wrap: anywhere; }
.n-type {
  font-family: var(--f-mono);
  font-size: 12px;
  color: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1px 7px;
  white-space: nowrap;
}
.n-body { display: grid; gap: 12px; }
.what { font-size: 15.5px; max-width: 66ch; }
.rows {
  display: grid;
  grid-template-columns: 88px minmax(0, 1fr);
  gap: 10px 14px;
  font-size: 15px;
}
.rows > dt { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding-top: 3px; }
.rows > dd { margin: 0; min-width: 0; color: var(--ink-2); }
.rows > dd.dec { color: var(--ink); font-weight: 500; }
@media (max-width: 560px) {
  .rows { grid-template-columns: minmax(0, 1fr); gap: 3px; }
  .rows > dd { margin-bottom: 9px; }
}
.io { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: start; }
.io > span:not(.io-a) { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 5px 9px; color: var(--ink); font-size: 14px; }
.io-a { color: var(--ink-3); padding-top: 5px; }
@media (max-width: 560px) {
  .io { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .io-a { padding: 0 0 0 10px; transform: rotate(90deg); justify-self: start; }
}
.code {

.nexts { display: flex; flex-wrap: wrap; gap: 6px; }

canonical policy.","in":"Nothing from the input item (it only triggers the run).","out":"One item: { version:'oak-event-v5', status:'active', document_json, activated_at }.","decides":"Every threshold, persona, trigger, channel and weight the engine uses.","code":"company_fit:{qualified_employee_min:1000,review_employee_min:500,disqualified_employee_max:499,...}\nurgency:{renewal_max_months:6,breach_score:40,audit_deadline_score:40}\nscoring:{persona_points:30,company_size_points:15,industry_points:15,urgency_points:40,max:100,...}\nnotifications:{tier_1:{channel:'booth-hot',owner_dm:true},matched:{channel:'booth-matched',owner_dm:false},needs_review:{channel:'booth-review',owner_dm:false},competitor_intel:{channel:'competitive-intel',owner_dm:false},out_of_scope:{channel:'',owner_dm:false},ops_alerts:{channel:'oak-revops',owner_dm:false},mention_tiers:['tier_1'],owner_overrides:{}}","branches":[],"on_failure":"No error settings; a syntax error stops the setup run. Note: the live active row also carries a crm block (create_company_if_missing, write_enrichment_to_company) that this seed does not contain; nothing in 00, 01, 02, 02A or 04 reads it, but a rerun would remove it.","say_it":"The entire ICP, from personas to channels to the 30/15/15/40 weights, is one JSON document seeded here and read by every workflow at run time.","next":["Enable Out-of-Scope Route"]},{"step":9,"name":"Enable Out-of-Scope Route","type":"Code","what":"Parses document_json (throwing 'Default policy JSON is invalid.' if it cannot) and sets notifications.out_of_scope to { channel:'booth-out-of-scope', owner_dm:false }, then re-stringifies it on the same row.","why":"Keeps the quiet out-of-scope audit route in policy data instead of hard-coded routing, and fails the setup loudly if the seed JSON is broken.","in":"The row from Build Default Policy ($input.first().json).","out":"The same row with the patched document_json.","decides":"The out_of_scope channel: booth-out-of-scope, no owner DM.","code":"try{p=JSON.parse(row.document_json||'{}');}catch(e){throw new Error('Default policy JSON is invalid.');}\np.notifications.out_of_scope={channel:'booth-out-of-scope',owner_dm:false};","branches":[],"on_failure":"Throws on invalid JSON, which stops the setup run on purpose. Plan Slack Channels later reads this node's output, not the table.","say_it":"Out-of-scope leads are still logged to a quiet channel, and that route is policy data, not a hard-coded branch.","next":["Seed Active Policy"]},{"step":10,"name":"Seed Active Policy","type":"Data Table upsert","what":"Upserts oak_policies (table selected by name) matching on version = $json.version, writing version, status, document_json and activated_at. On a fresh table it inserts; on a rerun it overwrites the oak-event-v5 row.","why":"Upsert on version means rerunning never creates a second v5 row.","in":"The patched row from Enable Out-of-Scope Route.","out":"The upserted row.","decides":null,"code":"filters: version = {{ $json.version }}\nvalue: { version, status, document_json, activated_at }","branches":[],"on_failure":"No error settings: a failed write stops the setup run. A rerun intentionally overwrites any hand edits made to the v5 row.","say_it":"The policy is upserted on its version string, so setup is rerunnable without duplicating the ICP.","next":["Retire Superseded Policies"]},{"step":11,"name":"Retire Superseded Policies","type":"Data Table update","what":"Updates oak_policies where version is not equal to the literal 'oak-event-v5' and sets status 'superseded'.","why":"Guarantees exactly one active policy row, which 01's 'status = active, limit 1' lookup depends on.","in":"Runs once per incoming item; its filter is a hard-coded literal, not the incoming version.","out":"The updated rows, or one empty item if none matched.","decides":"That every other policy version is superseded.","code":"filters: version neq 'oak-event-v5'\nvalue: { status: 'superseded' }","branches":[],"on_failure":"onError continueRegularOutput and alwaysOutputData: a failure or zero matching rows still emits an item so the chain continues. The version is hard-coded here, so a version bump in Build Default Policy must be mirrored in this filter.","say_it":"Retiring every other version is what makes 'the active policy' unambiguous.","next":["Build Competitor Seed"]},{"step":12,"name":"Build Competitor Seed","type":"Code","what":"Defines 17 competitor rows: Veza, SailPoint, Saviynt, Omada Identity, One Identity, Okta Identity Governance, Microsoft Entra ID Governance, Ping Identity, CyberArk, BeyondTrust, Delinea, Astrix Security, Oasis Security, Silverfort, Aembit, Token Security, Clutch Security. Each has domains (empty for Okta and Microsoft, whose corporate domains are too broad), aliases, category (identity_security, iga, pam, nhi_ai_identity), active true, verification_status (task_defined for Veza, user_confirmed_overlap for the rest) and a source note. It throws on any duplicate domain or alias. executeOnce is on.","why":"A duplicate alias would make two competitors match the same badge; throwing here keeps that bug out of the booth.","in":"Nothing from the input (executeOnce, so however many items Retire returned it runs once).","out":"17 items: name, domains_json, aliases_json, category, active, verification_status, source_note, updated_at.","decides":"The competitor register.","code":"for(const r of rows){for(const d of r.domains){const n=d.toLowerCase();if(ds.has(n))throw new Error('Duplicate domain: '+n);ds.add(n);}for(const a of r.aliases){const n=a.toLowerCase();if(as.has(n))throw new Error('Duplicate alias: '+n);as.add(n);}}","branches":[],"on_failure":"Throws on duplicates, stopping setup on purpose. executeOnce matters because Retire Superseded Policies can emit several items.","say_it":"The competitor list is validated for duplicate domains and aliases before it is written, so a bad seed fails at setup, not at the booth.","next":["Seed Competitors"]},{"step":13,"name":"Seed Competitors","type":"Data Table upsert","what":"Upserts each of the 17 rows into oak_competitors matching on name.","why":"Upsert on name makes reruns update rows (for example a corrected domain) instead of duplicating them.","in":"17 items from Build Competitor Seed.","out":"17 upserted rows.","decides":null,"code":"filters: name = {{ $json.name }}","branches":[],"on_failure":"No error settings; a failed write stops setup. Rows added by hand under a new name are left alone.","say_it":"Competitors are upserted by name, so the register is additive and rerunnable.","next":["Build Test Payload Seed"]},{"step":14,"name":"Build Test Payload Seed","type":"Code","what":"Defines 20 test scenarios for 07, each with suite, label, enabled, sort_order, payload_json, expect_json and notes. Only sort_order 1 to 4 (the four task leads: Rachel/tier_1, Hiroshi/matched, David/out_of_scope, Sarah/competitor_intel) are enabled. The rest cover a returning visitor, personal email, an invalid scan, an ambiguous title, a two-person cache pair, the 500-999 band, prompt injection, the compliance persona, Tier 1 by audit deadline, breach and Saviynt renewal, an unlisted competitor by name, a small identity vendor, no email, and booth notes outranking the website. It throws on a duplicate sort_order, a missing suite or label, or invalid payload/expect JSON. executeOnce is on.","why":"Shipping the suite with the export means a fresh import can prove itself, and the validation stops a malformed test from producing a false FAIL later.","in":"Nothing from the input (executeOnce; Seed Competitors emits 17 items).","out":"20 items.","decides":"Which scenarios the default harness run executes (the four enabled ones).","code":"if(seen.has(r.sort_order))throw new Error('Duplicate sort_order: '+r.sort_order);\ntry{JSON.parse(r.payload_json);}catch(e){throw new Error('Invalid payload_json on test row '+r.sort_order);}","branches":[],"on_failure":"Throws on bad seed data, stopping setup on purpose.","say_it":"The 20 test scenarios travel with the export, and only the four brief leads are on by default.","next":["Seed Test Payloads"]},{"step":15,"name":"Seed Test Payloads","type":"Data Table upsert","what":"Upserts the 20 rows into oak_test_payloads matching on sort_order.","why":"sort_order is stable, unique and numeric, so a label that drifted is corrected rather than duplicated.","in":"20 items from Build Test Payload Seed.","out":"20 upserted rows.","decides":null,"code":"filters: sort_order = {{ $json.sort_order }}","branches":[],"on_failure":"No error settings; a failure stops setup. A rerun resets every row's enabled flag to the seeded default, which is intentional.","say_it":"Tests are upserted on sort_order, so rerunning setup resets the suite to exactly the four brief leads.","next":["Setup Complete"]},{"step":16,"name":"Setup Complete","type":"Code","what":"Starts the report: ok true, policy_version 'oak-event-v5', the six table names, competitors_seeded and test_payloads_seeded (item counts from the two seed nodes) and rerunnable true.","why":"Collapses 20 items back to one, so the HubSpot stage runs once, and records what the storage stage wrote.","in":"Item counts from Seed Competitors and Seed Test Payloads.","out":"One item: { ok, policy_version, tables, competitors_seeded, test_payloads_seeded, rerunnable }.","decides":null,"code":"competitors_seeded:$('Seed Competitors').all().length,test_payloads_seeded:$('Seed Test Payloads').all().length","branches":[],"on_failure":"No error settings; it only counts items.","say_it":"Setup Complete is the checkpoint between the storage stage and the external provisioning stage.","next":["List HubSpot Contact Properties"]}]},{"name":"Provision HubSpot and Slack","purpose":"Provisions only retained Oak properties and every policy channel, including the quiet out-of-scope log.","nodes":[{"step":17,"name":"List HubSpot Contact Properties","type":"HTTP Request","what":"GET https://api.hubapi.com/crm/v3/properties/contacts with the HubSpot OAuth2 credential, returning every contact property the portal already has.","why":"Reading the schema first is what makes property provisioning idempotent: only missing properties are created.","in":"The Setup Complete item (only as a trigger).","out":"results[] of property definitions.","decides":null,"code":"GET https://api.hubapi.com/crm/v3/properties/contacts","branches":[],"on_failure":"retryOnFail 3 tries at 1500 ms, continueRegularOutput, alwaysOutputData. On failure the planner records lookup_error and, seeing no existing properties, treats all 18 as missing.","say_it":"Setup reads the HubSpot schema before touching it, so it only ever creates what is missing.","next":["Plan Oak Properties Raw"]},{"step":18,"name":"Plan Oak Properties Raw","type":"Code","what":"Defines 20 oak_* contact properties with label, type, fieldType and description, and keeps only those whose name the portal does not have, assigning groupName 'contactinformation'. oak_competitor_status is an enumeration/select with exactly none, possible, confirmed; oak_exclude_from_outreach is a bool/booleancheckbox; oak_lead_score and oak_scan_count are numbers; the rest are text or textarea.","why":"Provisioning oak_competitor_status as an enumeration means a fresh portal enforces the same three values as the live one, which is also why 02 must send a bare enum value.","in":"List HubSpot Contact Properties.","out":"schema_read, lookup_error, already_present, missing_count, missing_names, inputs (the definitions to create).","decides":"Which properties are missing.","code":"const missing=defs.filter(d=\u003e!existing.has(d.name)).map(d=\u003eObject.assign({},d,{groupName:'contactinformation'}));","branches":[],"on_failure":"No error settings; reading the schema response is wrapped in try/catch, so a failed GET becomes lookup_error rather than an exception.","say_it":"The property plan is a diff between what Oak needs and what the portal already has.","next":["Plan Oak Properties"]},{"step":19,"name":"Plan Oak Properties","type":"Code","what":"Filters out the two retired properties, oak_score_breakdown and oak_rule_summary, recomputes missing_count and missing_names, and records retired_properties.","why":"02 writes all Oak properties in one all-or-nothing PATCH; fewer properties means fewer ways for it to fail, and 02 folds the two retired values into oak_decision_reasons.","in":"Plan Oak Properties Raw.","out":"The same plan with at most 18 inputs and an updated missing_count.","decides":"The final set of properties to create (at most 18).","code":"const retired=['oak_score_breakdown','oak_rule_summary'];const inputs=(p.inputs||[]).filter(x=\u003e!retired.includes(x.name));","branches":[],"on_failure":"No error settings; pure data shaping.","say_it":"Two audit fields were retired on purpose and folded into the decision reasons, which leaves 18 Oak properties.","next":["Properties Missing?"]},{"step":20,"name":"Properties Missing?","type":"IF","what":"IF node, one condition: missing_count (number) is greater than 0, strict type validation.","why":"Skips the create call entirely when the portal is already provisioned, which is the normal rerun case.","in":"missing_count from Plan Oak Properties.","out":"The plan item on one of two outputs.","decides":"Whether any HubSpot properties need creating.","code":"leftValue: {{ $json.missing_count }}  operator: number gt  rightValue: 0","branches":[{"label":"true","goes_to":"Create Oak Properties","meaning":"At least one oak_* property is missing, so batch-create them."},{"label":"false","goes_to":"Plan Slack Channels","meaning":"All properties exist; go straight to Slack provisioning."}],"on_failure":"An IF on a number does not realistically fail.","say_it":"On a rerun the portal is already provisioned, so this IF skips the HubSpot write entirely.","next":["Create Oak Properties","Plan Slack Channels"]},{"step":21,"name":"Create Oak Properties","type":"HTTP Request","what":"POST https://api.hubapi.com/crm/v3/properties/contacts/batch/create with inputs = the planned definitions; any definition with type 'bool' gets options Yes ('true') and No ('false') added.","why":"HubSpot requires explicit options for a boolean checkbox; one batch call creates every missing property.","in":"$('Plan Oak Properties').first().json.inputs.","out":"results[] of created properties, or an error item.","decides":null,"code":"inputs: $('Plan Oak Properties').first().json.inputs.map(d =\u003e d.type === 'bool' ? { ...d, options: [{ label: 'Yes', value: 'true', displayOrder: 0, hidden: false }, { label: 'No', value: 'false', displayOrder: 1, hidden: false }] } : d)","branches":[],"on_failure":"retryOnFail 2 tries at 2000 ms, continueRegularOutput, alwaysOutputData. A missing crm.schemas.contacts.write scope becomes a warning in the final report rather than stopping the run.","say_it":"All missing Oak properties are created in one batch call, and a scope problem becomes a named warning instead of a crash.","next":["Plan Slack Channels"]},{"step":22,"name":"Plan Slack Channels","type":"Code","what":"Parses the policy document from Enable Out-of-Scope Route, walks notifications, skips any entry without a channel (mention_tiers and owner_overrides), strips '#', lowercases and dedupes names, and marks a channel private if it is in slack.private_channels. Result: booth-hot, booth-matched, booth-review, competitive-intel (private), booth-out-of-scope, oak-revops. If nothing is found it falls back to booth-review.","why":"Deriving channels from the same document the router reads means Slack and routing cannot drift apart.","in":"$('Enable Out-of-Scope Route').first().json.document_json (the seed, not the live table row).","out":"One item per channel: channel_name, tier, visibility (public | private).","decides":"Which channels to create and which one is private.","code":"rows.push({json:{channel_name:name,tier:key,visibility:privateList.indexOf(name)\u003e=0?'private':'public'}});","branches":[],"on_failure":"No error settings; JSON parsing is in try/catch and falls back to a single booth-review channel.","say_it":"The Slack channel list is computed from the policy's routing block, so the workspace always matches the rules.","next":["Create Slack Channel"]},{"step":23,"name":"Create Slack Channel","type":"Slack (channel create)","what":"Slack node, resource channel (create), once per planned channel, using the Slack OAuth2 credential (slackOAuth2Api 'Slack account'), with the channel name and visibility from the plan.","why":"Posting fails if a channel does not exist, so setup creates all six up front.","in":"channel_name and visibility per item.","out":"One result per channel: the channel (id) or an error item.","decides":null,"code":"channelId: {{ $json.channel_name }}  channelVisibility: {{ $json.visibility }}","branches":[],"on_failure":"retryOnFail 2 tries at 1500 ms, continueRegularOutput, alwaysOutputData. name_taken on a rerun is expected and counted as already provisioned. It does not join channels it did not create, so if a card never appears, check the app is a member.","say_it":"Channel creation treats name_taken as success, which is what makes the Slack stage rerunnable.","next":["Report Setup Result"]},{"step":24,"name":"Report Setup Result","type":"Code","what":"Builds the final readiness report. For HubSpot: which properties already existed, which were created, which are still missing, and ready when missing_count is 0 or every missing one was created. For Slack: each channel matched by index to its result as created, already_exists (name_taken) or failed. It adds warnings naming the fix (crm.schemas.contacts.write; channels:manage and groups:write) and next steps (map HubSpot owners to Slack ids in slack.owner_directory for DMs; activate 01 and point the scanner at its webhook).","why":"A setup run should end with a plain answer to 'is it ready, and if not what exactly do I fix'.","in":"Setup Complete, Plan Oak Properties, Create Oak Properties (if it ran), Plan Slack Channels, Create Slack Channel.","out":"The full report: ...Setup Complete fields, hubspot_properties, slack_channels, crm_tagging_ready, alerting_ready, warnings, next.","decides":"crm_tagging_ready and alerting_ready.","code":"const propsReady=plan.missing_count===0||created.length===plan.missing_count;\nconst taken=/name_taken/i.test(err);\nstate:r.id?'created':(taken?'already_exists':'failed')","branches":[],"on_failure":"No error settings; every upstream read is guarded, and Create Oak Properties being skipped is handled by try/catch.","say_it":"Setup ends with a readiness report that names the missing scope instead of just saying it failed.","next":[]}]}],"decisions":[{"title":"The ICP is data, not code","why":"Personas, title patterns, the 500 and 1,000 bands, triggers, channels, competitor terms and scoring weights live in one oak_policies row that every workflow reads at run time. A live tweak is a row edit; a permanent change is an edit in Build Default Policy plus a rerun."},{"title":"Idempotent by design","why":"Tables are create-if-not-exists, rows are upserts on stable keys (version, name, sort_order), HubSpot properties are created only if missing, and Slack's name_taken counts as success. It is safe to rerun mid-event by someone unsure of the state."},{"title":"Exactly one active policy","why":"Upsert on version plus 'mark every other version superseded' means 01's 'status = active, limit 1' lookup can never pick the wrong row."},{"title":"Fail loudly at setup, not at the booth","why":"A duplicate competitor domain or alias, a duplicate test sort_order, or invalid JSON throws here, so a bad seed stops the setup run instead of misrouting a scan later."},{"title":"Channels come from the policy","why":"Plan Slack Channels derives channel names from the policy's notifications block, so the Slack workspace and the routing rules cannot drift apart."},{"title":"The test suite ships with the export","why":"All 20 scenarios are seeded into oak_test_payloads, but only the four task leads are enabled, so a default 07 harness run is exactly the brief."}],"questions":[{"q":"Why is setup a separate workflow, and why is it never published?","a":"It is one-time provisioning with a manual trigger; nothing calls it, so there is no reason for it to be active, and it runs from the draft. Keeping it separate means the hot path in 01 never carries setup logic."},{"q":"How would you change the ICP for the next event?","a":"For a live change, edit document_json on the active oak_policies row; the next scan reads it with no deploy. For a permanent change, edit Build Default Policy and rerun 00, which upserts the version as active and marks every other version superseded. If you bump the version string, Retire Superseded Policies also has 'oak-event-v5' hard-coded in its filter and must be edited too."},{"q":"What happens if you run it twice?","a":"Nothing doubles. Tables are reused, policy, competitors and tests are upserted on version, name and sort_order, only missing HubSpot properties are created, and Slack returns name_taken, which the report counts as already provisioned. The deliberate overwrites are the active policy row (hand edits to v5 are lost) and the test rows' enabled flags (reset to the default four)."},{"q":"Why 18 HubSpot properties and not 20?","a":"Plan Oak Properties Raw defines 20, and Plan Oak Properties removes oak_score_breakdown and oak_rule_summary. 02 writes all Oak properties in one all-or-nothing PATCH, so their content is prepended to oak_decision_reasons instead; nothing is lost and there are fewer ways for the PATCH to fail."},{"q":"Why are all 17 competitors active?","a":"A missed competitor at the booth costs more than a false positive. False positives are handled by the False alarm button on the competitor card, and verification_status records how each row was established. Okta Identity Governance and Microsoft Entra ID Governance have no domains because okta.com and microsoft.com are too broad; they match on name and alias only."},{"q":"How do you know setup worked?","a":"Report Setup Result returns crm_tagging_ready and alerting_ready plus explicit warnings naming the missing scope (crm.schemas.contacts.write for properties, channels:manage and groups:write for Slack) and the next steps."}]},{"id":"01","name":"Oak GTM - 01 Intake & Decision","short":"Intake & Decision","lane":"intake","one_breath":"01 is the orchestrator behind the booth webhook. It checks the secret, validates the scan, blocks a replayed scan_id, classifies the lead with first-match-wins rules read from the active policy row, writes the encounter and ledger rows and answers the scanner with a provisional 202 in about two seconds. It then keeps running: 02A reads HubSpot, 04 enriches, 05 does bounded AI synthesis, a final deterministic gate settles the tier, 02 writes HubSpot, 03 posts the Slack card, and the settled decision is stored in oak_deliveries and oak_encounters, which is the authoritative answer, not the HTTP reply.","trigger":"Webhook POST https://oak-noam.app.n8n.cloud/webhook/oak-event/scan (node 'Receive Booth Scan', response mode 'Using Respond to Webhook node', CORS allowed origins *)","input":"JSON body: scan_id, first_name, last_name, email, job_title, company_name, optional company_domain, scanned_at, notes_from_booth, optional event_id (default 'oak-live-event-2026'). Header x-oak-webhook-secret must equal the n8n variable OAK_WEBHOOK_SECRET when that variable is set.","output":"HTTP: 401 unauthorized, 400 invalid (errors: scan_id / person_identity), 200 duplicate_ignored, or 202 accepted with provisional_* fields. Durable: one oak_deliveries row per scan_id (status accepted, then complete; raw_json = full final payload without policy; slack_json = Slack receipt) and one oak_encounters row per event_person_key (scan_count, scan_history_json, last_classification, last_payload_json and more). Side effects through sub-workflows: HubSpot company, contact, Oak properties, meeting and note (02); Slack card or thread reply (03).","called_by":["Booth scanner app (POST to the webhook)","07 Task Test Harness (replays oak_test_payloads through the same live webhook)"],"calls":["02A","04","05","02","03"],"node_count":40,"groups":[{"name":"Ungrouped","purpose":"The booth webhook itself: receives the POST and hands it on without replying.","nodes":[{"step":1,"name":"Receive Booth Scan","type":"Webhook","what":"Webhook node listening for POST on path oak-event/scan, with response mode 'Using Respond to Webhook node' and allowed origins '*'. It emits one item with headers, params, query and body. It does not answer the caller itself; one of four Respond to Webhook nodes later does (401, 400, 200 or 202).","why":"Response mode 'Respond to Webhook node' is what lets 01 answer the scanner early with a 202 and keep working afterwards; the default 'when last node finishes' would make the scanner wait for enrichment and AI.","in":"The HTTP POST from the scanner app or 07.","out":"One item: { headers, params, query, body }.","decides":null,"code":"httpMethod: POST  path: oak-event/scan  responseMode: responseNode  allowedOrigins: *","branches":[],"on_failure":"No node settings. If the workflow later ends without reaching a Respond node, the caller does not get a designed JSON reply.","say_it":"The webhook deliberately does not reply itself, so the workflow can answer the rep in two seconds and keep working.","next":["Normalize Scan"]}]},{"name":"1. Accept the scan","purpose":"Normalize, check the secret header, reject a scan with no identity, block a replayed scan_id, and load the active ICP policy.","nodes":[{"step":2,"name":"Normalize Scan","type":"Code","what":"Runs once per item and turns the raw request into one clean lead object. It reads the secret header against the n8n variable OAK_WEBHOOK_SECRET (auth enforced only if the variable is set), lowercases the email and validates it with a simple x@y.z regex, and takes company_domain from the scanner (stripping http(s)://, www. and paths) or infers it from a non-personal email domain. It builds a company name from the domain when none was sent ('apex-finance.com' becomes 'Apex Finance'), builds event_person_key = event_id|email (or event_id|scan:\u003cscan_id\u003e without a valid email), hashes the lowercased notes with FNV-1a into notes_hash, lists soft gaps in data_quality.missing_fields, and marks the scan invalid only if scan_id is missing or there is no email, no first name, no last name and no company.","why":"Every later node reads one normalized shape, and the only two hard rejections are decided in one place. Personal domains (gmail.com, outlook.com and seven others) are never treated as a company.","in":"$json.headers['x-oak-webhook-secret'], $json.body (or the item itself), n8n variable OAK_WEBHOOK_SECRET.","out":"scan_id, event_id, event_person_key, first_name, last_name, full_name, email ('' if invalid), email_valid, email_domain, personal_email, company_domain, company_domain_source (scanner | email_domain | unknown), job_title, company_name, company_name_source, scanned_at (now if missing), notes_from_booth, notes_hash, auth_ok, auth_mode (enforced | open_no_secret_configured), valid, validation_errors, data_quality {missing_fields, complete, can_sync_contact, can_enrich_company}, normalized_at.","decides":"auth_ok, valid (with reason codes scan_id / person_identity), the company domain and event_person_key.","code":"const authOk=expectedSecret?(suppliedSecret===expectedSecret):true;\nconst inferredDomain=!suppliedDomain&&emailValid&&personal.indexOf(emailDomain)\u003c0?emailDomain:'';\nevent_person_key:eventId+'|'+(emailValid?email:('scan:'+scanId))\nif(!scanId)fatal.push('scan_id');\nif(!emailValid&&!first&&!last&&!companyName)fatal.push('person_identity');","branches":[],"on_failure":"No error settings on the node. A code exception would fail the execution before any reply (99 is the error workflow). Note the side effect of the key rule: a scan with no valid email gets a per-scan key, so it can never be recognised as a returning visitor.","say_it":"Normalize Scan is the single place that decides auth, validity and identity, so every other node can trust the shape of the lead.","next":["Authorized?"]},{"step":3,"name":"Authorized?","type":"IF","what":"IF on auth_ok is true (boolean, strict). When OAK_WEBHOOK_SECRET is set, only a matching x-oak-webhook-secret header passes; when it is not set, every scan passes and auth_mode says open_no_secret_configured.","why":"Auth is computed in code rather than with the webhook's built-in auth so it can return a clean JSON 401 body and so enforcement can be switched on by setting a variable, with no redeploy.","in":"auth_ok from Normalize Scan.","out":"The same item on the true or false output.","decides":"Whether the request is allowed in.","code":"leftValue: {{ $json.auth_ok }}  operator: boolean true","branches":[{"label":"true","goes_to":"Valid Scan?","meaning":"Secret matches (or none is configured): continue to validation."},{"label":"false","goes_to":"Respond Unauthorized","meaning":"Missing or wrong secret: reply 401 and stop. Nothing is stored, enriched or alerted."}],"on_failure":"An IF on a boolean does not realistically fail.","say_it":"Auth runs first and fails closed with a 401 as soon as a secret is configured.","next":["Valid Scan?","Respond Unauthorized"]},{"step":4,"name":"Respond Unauthorized","type":"Respond to Webhook","what":"Replies HTTP 401 with JSON { accepted:false, status:'unauthorized', scan_id, message:'Missing or incorrect x-oak-webhook-secret header.' }. It is a dead end: no node follows it.","why":"A clear, machine-readable rejection lets the scanner app show the rep what is wrong instead of a generic error.","in":"scan_id from the item.","out":"The HTTP response to the caller.","decides":null,"code":"responseCode: 401  body: { accepted: false, status: 'unauthorized', scan_id: $json.scan_id || null, message: 'Missing or incorrect x-oak-webhook-secret header.' }","branches":[],"on_failure":"No settings; the run simply ends after replying.","say_it":"An unauthorised scan gets a 401 and touches nothing.","next":[]},{"step":5,"name":"Valid Scan?","type":"IF","what":"IF on valid is true (boolean, strict). valid is false only when scan_id is missing or the scan has no email, no first name, no last name and no company at all.","why":"The only hard stop in the pipeline. Everything else (missing title, missing notes, personal email) is a soft gap that still produces an alert.","in":"valid from Normalize Scan.","out":"The item on the true or false output.","decides":"Whether the scan is usable at all.","code":"leftValue: {{ $json.valid }}  operator: boolean true","branches":[{"label":"true","goes_to":"Find Existing Scan","meaning":"Usable scan: check whether this scan_id was already processed."},{"label":"false","goes_to":"Build Invalid Response","meaning":"No scan_id or no identity at all: reply 400 with the reason codes. Nothing is written."}],"on_failure":"An IF on a boolean does not realistically fail.","say_it":"Only two things block a scan: no scan_id, or no way at all to tell who the person is.","next":["Find Existing Scan","Build Invalid Response"]},{"step":6,"name":"Build Invalid Response","type":"Code","what":"Builds the 400 body: { accepted:false, status:'invalid', scan_id, errors: validation_errors }, where errors holds the codes 'scan_id' and/or 'person_identity'.","why":"The reason codes let the scanner app tell the rep exactly what is missing. status 'invalid' exists only in this reply; no ledger row is written.","in":"scan_id and validation_errors from Normalize Scan.","out":"The response body item.","decides":null,"code":"return{json:{accepted:false,status:'invalid',scan_id:$json.scan_id||null,errors:$json.validation_errors||[]}};","branches":[],"on_failure":"No settings; trivial code.","say_it":"An invalid scan gets reason codes back and leaves no trace in the ledger.","next":["Respond Invalid"]},{"step":7,"name":"Respond Invalid","type":"Respond to Webhook","what":"Replies HTTP 400 with the body built by Build Invalid Response. Dead end.","why":"Separates the invalid path cleanly from the accepted path.","in":"$json from Build Invalid Response.","out":"The HTTP response.","decides":null,"code":"responseCode: 400  responseBody: {{ $json }}","branches":[],"on_failure":"No settings; the run ends after replying.","say_it":"A 400 with reason codes, and the run stops.","next":[]},{"step":8,"name":"Find Existing Scan","type":"Data Table get","what":"Reads oak_deliveries (selected by name) where scan_id equals this scan's scan_id, limit 1.","why":"The ledger row's status is the replay guard: 'complete' means this exact scan already ran end to end.","in":"$('Normalize Scan').item.json.scan_id","out":"The ledger row if one exists, otherwise one empty item.","decides":null,"code":"filters: scan_id = {{ $('Normalize Scan').item.json.scan_id }}  limit: 1","branches":[],"on_failure":"alwaysOutputData is on, so 'no row' still emits an empty item and the flow continues; there is no continue-on-error, so a Data Table outage fails the run before any reply.","say_it":"Replay protection is a single ledger lookup on scan_id.","next":["Duplicate Delivery?"]},{"step":9,"name":"Duplicate Delivery?","type":"IF","what":"IF the ledger row's status equals 'complete' (string, strict; missing status is treated as '').","why":"Blocks exact replays without blocking recovery: only a scan that finished end to end is a duplicate, while one stuck at 'accepted' runs again.","in":"$json.status from Find Existing Scan.","out":"The item on the true or false output.","decides":"Duplicate (ignore) vs new or retry (process).","code":"leftValue: {{ $json.status ?? '' }}  operator: string equals  rightValue: complete","branches":[{"label":"true","goes_to":"Build Duplicate Response","meaning":"This scan_id already completed: reply 200 duplicate_ignored; no CRM write, no Slack post."},{"label":"false","goes_to":"Load Active Policy","meaning":"New scan, or a scan that died mid-pipeline (still 'accepted'): process it."}],"on_failure":"An IF on a string does not realistically fail.","say_it":"Only a completed scan_id is a duplicate, so re-sending a half-finished scan is the recovery path.","next":["Build Duplicate Response","Load Active Policy"]},{"step":10,"name":"Build Duplicate Response","type":"Code","what":"Builds { accepted:true, status:'duplicate_ignored', scan_id, message } explaining that the scan was already processed end to end, that nothing will be written or posted, and that a scan that failed mid-pipeline is not marked complete so re-sending it is safe.","why":"The scanner gets a success-shaped answer (the scan is known) while the system guarantees no double CRM write and no double Slack card.","in":"$('Normalize Scan').item.json.scan_id","out":"The response body item.","decides":null,"code":"return{json:{accepted:true,status:'duplicate_ignored',scan_id:s.scan_id,message:'This scan_id was already processed end to end. ...'}};","branches":[],"on_failure":"No settings; trivial code.","say_it":"A duplicate is acknowledged, not rejected, and nothing downstream runs.","next":["Respond Duplicate"]},{"step":11,"name":"Respond Duplicate","type":"Respond to Webhook","what":"Replies HTTP 200 with the duplicate body. Dead end.","why":"Idempotent webhook behaviour: the same request twice gives a clean answer and no side effects.","in":"$json from Build Duplicate Response.","out":"The HTTP response.","decides":null,"code":"responseCode: 200  responseBody: {{ $json }}","branches":[],"on_failure":"No settings; the run ends after replying.","say_it":"A replayed scan gets 200 duplicate_ignored and the run stops.","next":[]},{"step":12,"name":"Load Active Policy","type":"Data Table get","what":"Reads oak_policies (by name) where status = 'active', limit 1. The row's document_json (currently oak-event-v5) holds every persona, threshold, trigger, channel and weight Evaluate ICP Policy uses.","why":"This is what makes the ICP data instead of code: a row edit changes the next scan's behaviour with no deploy.","in":"Runs once for the single item coming from Duplicate Delivery? (false).","out":"One policy row: version, status, document_json, activated_at.","decides":null,"code":"filters: status = active  limit: 1","branches":[],"on_failure":"alwaysOutputData, like every other lookup here, and no continue-on-error. With no row at status 'active' it emits one empty item, so the run still replies: Evaluate ICP Policy falls back to its code defaults, which hold no personas, so every scan lands in out_of_scope (or competitor_intel from the competitor table) until a policy is active. Invalid document_json takes the same fallback. A Data Table outage still fails the run before the reply.","say_it":"One row lookup loads the whole ICP; with no active row the run still replies, on conservative defaults that route nothing to sales.","next":["Load Competitors"]}]},{"name":"2. Classify and spot returning visitors","purpose":"First routing decision, in deterministic code against the policy table: competitor, persona, size band, trigger, score. Later stages can move it.","nodes":[{"step":13,"name":"Load Competitors","type":"Data Table get","what":"Reads every row of oak_competitors (by name) where active is true, returnAll. Today that is 17 rows, each with name, domains_json, aliases_json, category and verification_status.","why":"The competitor register is data: add a row and the next scan honours it with no workflow edit.","in":"Runs once for the policy item from Load Active Policy.","out":"One item per active competitor row.","decides":null,"code":"filters: active isTrue  returnAll: true","branches":[],"on_failure":"continueRegularOutput and alwaysOutputData. If the read fails the output is an error item with no name, which Evaluate ICP Policy filters out, so the scan is classified with no competitor check at all (silently).","say_it":"Competitors are rows, not code, so the register grows without a deploy.","next":["Evaluate ICP Policy"]},{"step":14,"name":"Evaluate ICP Policy","type":"Code","what":"The first routing decision, all deterministic, against the parsed policy. (1) Competitor: for each active row, exact match of company_domain against domains_json, or a whole-word match of the company name against the row name or an alias; the first hit sets competitor with matched_on domain | company_name. (2) Possible competitor: if no confirmed hit, a whole-word match of the company name against policy possible_name_tokens ('identity security', 'identity governance', 'access governance', 'identity platform', 'privileged access', 'non-human identity', 'machine identity', 'identity fabric', 'identity management', 'access management'). (3) Persona: walks ciso, iam, compliance in order; the first whose title_patterns is a substring of the lowercased title wins, else 'other'. (4) Relevance signals: policy relevance_signals found in title or notes, recorded but never scored. (5) Headcount from notes with a number followed by employees/people/staff/seats/users: \u003e=1000 qualified_1000_plus, \u003e=500 review_500_999, below disqualified_under_500, none unknown. (6) Disqualifiers 'saas-only' / 'single-cloud' as substrings of the notes. (7) Incumbents: whole-word match in the notes against the 7 active incumbent tools and aliases. (8) Tier 1 triggers quoted from the notes: incumbent_renewal (a renewal-in-N-months phrase with N \u003c= renewal_max_months 6 AND a matched incumbent with renewal_trigger; the original 'renewal ... N months' / 'N months ... renewal' patterns run first, then a second pass accepts renew / renews / renewing / renewed / renewal with number words one to twelve, 'a year' (12) and 'half a year' (6), and ignores 'N months ago'; quarters and seasons are not read; a renewal with no matched tool is logged as unverified_renewal and does not trigger), identity_breach ('breach', 'breaches', 'breached', 'post-breach', optionally after identity / security / data / cyber / credential / account; ignored when never / no / not / none / without / zero or a haven't-style contraction sits within the three words before it in the same clause, after 'no history of' or 'free of / from', and in the contract sense: breach of contract / agreement / SLA / terms / NDA, contract or SLA breach, breach-free), audit_deadline (audit within 30 characters of deadline/due/active, deadline then audit, or sox within 25 characters of deadline/due/active). Then the cascade picks the classification, the score is computed, and every rule that fired adds a readable reason and a {code, detail, source} trace entry.","why":"This is the product: a reproducible, explainable classification that any row edit in the policy changes. Doing it before the 202 means the scanner gets a meaningful provisional answer.","in":"$('Normalize Scan').first().json, $('Load Active Policy').first().json.document_json, $('Load Competitors').all().","out":"{...scan, policy_version, policy (the whole document, removed later), persona, persona_source (rule_title_match | none_from_rules), persona_status (competitor | matched | matched_fit_review | matched_but_disqualified | ambiguous | irrelevant), persona_angle, listen_for, relevance_signals, urgency_evidence, employee_count_observed, company_size_band, renewal_months_observed, incumbent_tools_detected, competitor, competitor_status (confirmed | possible | none), classification, intelligence_required (true for all five), persona_reasoning_required (true only for tier_1 / matched / needs_review), score, score_breakdown {persona, company_size, industry:0, urgency, total, max}, decision_reasons, decision_trace, rule_summary, decision_basis, routing {channel, owner_dm, mention}, notes_untrusted:true, injection_suspected, competitor_dont_say}","decides":"classification (competitor_intel | needs_review | out_of_scope | tier_1 | matched), persona, the provisional score, routing, and the two flags that gate the sub-workflows.","code":"if(competitor){classification='competitor_intel';personaStatus='competitor';}else if(possibleNameHit){classification='needs_review';}else if(outBySize||dqHits.length){classification='out_of_scope';personaStatus=targetPersona?'matched_but_disqualified':'irrelevant';}else if(targetPersona&&reviewBySize){classification='needs_review';personaStatus='matched_fit_review';}else if(targetPersona){classification=urgency.length?'tier_1':'matched';personaStatus='matched';}else if(relevanceSignals.length){classification='needs_review';personaStatus='ambiguous';}\nif(renewalTool&&months!==null&&months\u003c=maxMonths)urgency.push({type:'incumbent_renewal',tool:renewalTool.name,value:months,quote:rawNotes.slice(0,400),source:'scanner'});\nconst personaPoints=targetPersona?Number(sc.persona_points||30):0;\nconst sizePoints=sizeBand==='qualified_1000_plus'?Number(sc.company_size_points||15):0;\nconst urgencyPoints=urgency.length?Number(sc.urgency_points||40):0;\npersona_reasoning_required:classification!=='competitor_intel'&&['tier_1','matched','needs_review'].includes(classification)","branches":[],"on_failure":"No error settings. The policy parse is in try/catch: invalid document_json silently becomes an empty policy (no personas, no channels), so nearly everything would classify out_of_scope with an empty channel. Details worth knowing: the urgency 'quote' is the first 400 characters of the notes, not the exact phrase; a possible-name hit leaves persona_status 'irrelevant' even for a CISO title; the One Identity alias 'identity manager' is generic, so notes saying 'our identity manager' count as that incumbent.","say_it":"Evaluate ICP Policy is a first-match-wins ladder read from the policy row: competitor, possible competitor, hard disqualifier, 500-999 review, persona plus quoted trigger for Tier 1, persona alone for matched, context-only for review, else out of scope.","next":["Load Prior Encounter"]},{"step":15,"name":"Load Prior Encounter","type":"Data Table get","what":"Reads oak_encounters (by name) where event_person_key equals this scan's key, limit 1.","why":"The encounter row is how the system knows this person was already scanned at this event, and it carries the rep's earlier decisions (override, exclude) forward.","in":"$('Evaluate ICP Policy').item.json.event_person_key","out":"The prior encounter row, or one empty item.","decides":null,"code":"filters: event_person_key = {{ $('Evaluate ICP Policy').item.json.event_person_key }}  limit: 1","branches":[],"on_failure":"alwaysOutputData, so 'first scan' is an empty item and the flow continues; no continue-on-error, so a Data Table outage fails the run before the reply.","say_it":"The person key is event plus email, so the same badge at the same event finds its history.","next":["Build Visitor Context"]},{"step":16,"name":"Build Visitor Context","type":"Code","what":"Returning-visitor logic. scan_count = prior count + 1 and repeat_scan = count \u003e 1. classification_changed compares the prior last_classification with today's provisional classification; notes_changed compares notes hashes. notification_mode is first_scan, repeat_thread (same tier: reply in the first card's thread) or repeat_escalation (tier changed). It appends this scan to scan_history (kept to the last 20; an older row with only notes_from_booth is converted into a one-entry history), and carries previous_slack_channel / previous_slack_ts and previous_notes_from_booth for 03. It also reads the rep's earlier decisions from the row: rep_override (override_classification), rep_override_reason (downgrade_reason), rep_override_by / _at (last_action_by / _at) and rep_excluded_from_outreach. It also carries earlier urgency forward: the urgency_evidence in the prior encounter's last_payload_json is added to this scan's (tagged source 'earlier_scan' with carried_from_scan_id / carried_from_scanned_at, duplicates of a trigger this scan already quotes dropped), urgency points are added if this scan had none, and a matched lead becomes tier_1 with rule 'Tier 1: \u003cPERSONA\u003e + \u003ctrigger\u003e (earlier scan)' and trace urgency_carried_forward. Persona, size and competitor still come from this scan; classification_changed is computed after the carry.","why":"A returning visitor must be alerted in the thread of the first card with what they said last time, a trigger they gave on the first visit is still true on the second, and a rep's Not a fit or Promote on the first scan must be honoured on the second. This node gathers all of that before the tier is settled.","in":"$('Evaluate ICP Policy').first().json and the prior encounter row ($json).","out":"{...evaluated lead (urgency_evidence, classification, routing, rule_summary, score, score_breakdown, decision_reasons and decision_trace updated when earlier urgency is carried, plus urgency_carried_forward), repeat_scan, scan_count, prior_classification, rep_override, rep_override_reason, rep_override_by, rep_override_at, rep_excluded_from_outreach, classification_changed, notes_changed, material_change, notification_mode, repeat_reason, repeat_indicator ('RETURNING VISITOR - scan #n'), previous_scan, previous_notes_from_booth, scan_history, scan_history_json, previous_slack_channel, previous_slack_ts, first_scanned_at}","decides":"notification_mode (first_scan | repeat_thread | repeat_escalation), whether earlier urgency lifts a matched lead to tier_1, and the rep override that the final gate applies.","code":"const earlier=(last&&Array.isArray(last.urgency_evidence))?last.urgency_evidence:[];\nconst carried=earlier.filter(e=\u003ee&&e.type&&!cur.some(c=\u003ec&&c.type===e.type&&String(c.tool||'')===String(e.tool||''))).map(e=\u003eObject.assign({},e,{source:'earlier_scan',...}));\nif(d0.classification==='matched'){ classification='tier_1'; ... }\nconst n=Number((prior&&prior.scan_count)||0)+1;\nconst classChanged=Boolean(repeat&&prior.last_classification&&prior.last_classification!==d.classification);\nconst mode=repeat?(classChanged?'repeat_escalation':'repeat_thread'):'first_scan';\nrep_override:(prior&&prior.override_classification)||null","branches":[],"on_failure":"No error settings; JSON parsing of history is in try/catch. Two subtleties: the prior row's last_classification is the FINAL tier of the last scan, compared with this scan's PROVISIONAL tier (04 recomputes the mode against its own result later); and there is no check that this scan_id is already in scan_history, so re-sending a scan stuck at 'accepted' finds its own row and is counted as a returning visitor (scan #2).","say_it":"Build Visitor Context is where 'same person, new scan' becomes a thread reply with what they said last time, and where a rep's earlier call is picked up for the final gate.","next":["Load Company Cache"]},{"step":17,"name":"Load Company Cache","type":"Data Table get","what":"Reads oak_enrichment_cache (by name) where company_domain equals this scan's domain, limit 1.","why":"Two people from one company should not pay for enrichment twice, and a fresh cache row can flag a possible competitor before the 202.","in":"$('Build Visitor Context').item.json.company_domain","out":"The cache row, or one empty item.","decides":null,"code":"filters: company_domain = {{ $('Build Visitor Context').item.json.company_domain }}  limit: 1","branches":[],"on_failure":"alwaysOutputData, so a miss continues; no continue-on-error.","say_it":"The enrichment cache is keyed on domain, the same key the CRM uses for companies.","next":["Build Alert Package"]},{"step":18,"name":"Build Alert Package","type":"Code","what":"Uses the cache row only if status is 'complete' and expires_at is in the future (the 30-day TTL written by 04), parsing payload_json and evidence_json. If that cached homepage read flagged possible_competitor and the lead is not a confirmed competitor, not competitor_intel and not out_of_scope, it sets competitor_status 'possible', moves the lead to needs_review, routes it to the review channel with no mention, and adds a reason. It then sets crm_context to a 'pending' placeholder and builds the alert object: headline (repeat indicator, or CLASSIFICATION - name), who, why_now (all reasons joined), what_to_do (competitor: the policy's don't-say line plus 'Capture what they ask about and route to competitive intelligence'; out_of_scope: 'Qualify politely, keep the CRM record, and do not escalate to sales'; otherwise 'Qualify the environment first. Position: ' plus the persona angle), score, evidence and routing.","why":"It lets the 202 reflect what the system already knows about the company, and gives 01 an early possible-competitor catch for a company scanned before.","in":"$('Build Visitor Context').first().json and the cache row ($json).","out":"{...visitor lead, classification, competitor_status, routing, decision_reasons, enrichment_cache_hit, needs_company_enrichment, company_enrichment, company_evidence, crm_context:{lookup_status:'pending', ...}, alert:{headline, who, why_now, what_to_do, score, score_breakdown, crm_context, evidence, repeat_scan, scan_count, delivery_mode, routing}}","decides":"Whether a cached possible-competitor signal moves the lead to needs_review before the 202.","code":"const fresh=Boolean(c&&c.expires_at&&new Date(c.expires_at).getTime()\u003eDate.now()&&String(c.status||'')==='complete');\nif(competitorStatus!=='confirmed'&&enrichment.possible_competitor===true&&classification!=='out_of_scope'&&classification!=='competitor_intel'){\n  competitorStatus='possible';\n  classification='needs_review';","branches":[],"on_failure":"No error settings; JSON parsing is in try/catch. Two details: this promotion updates classification and reasons but not rule_summary or decision_trace, so the 202's provisional_rule_summary can still read 'Matched: ...'; and 04 applies a stricter freshness test to the same cache row (it also rejects parked or unverified evidence), so enrichment_cache_hit here is only a preview. The actual fetch-skipping happens inside 04.","say_it":"Build Alert Package turns the classification into a rep-ready alert and lets a fresh cache row flag a possible competitor before the scanner even gets its answer.","next":["Upsert Encounter"]}]},{"name":"3. Record and answer the scanner","purpose":"Writes the encounter and ledger rows, then answers the scanner in about two seconds with a decision marked provisional.","nodes":[{"step":19,"name":"Upsert Encounter","type":"Data Table upsert","what":"Upserts oak_encounters on event_person_key, writing identity (event_id, email, full_name, job_title, company_name, company_domain, notes_from_booth), scan_count, first_scanned_at, last_scanned_at, last_notes_hash, last_classification (the provisional tier), scan_history_json, updated_at, and last_slack_channel / last_slack_ts carried from the prior row (or '').","why":"The returning-visitor count and history must be durable before anything slow happens. Rep fields (override_classification, claim fields, booth_status) are not in the mapping, so a re-scan never erases what a rep did.","in":"$('Build Alert Package').item.json fields.","out":"The upserted encounter row.","decides":null,"code":"filters: event_person_key = {{ $('Build Alert Package').item.json.event_person_key }}\nlast_classification: {{ $('Build Alert Package').item.json.classification }}\nlast_slack_ts: {{ $('Build Alert Package').item.json.previous_slack_ts ?? '' }}","branches":[],"on_failure":"No error settings: a Data Table failure fails the run before the 202 is sent (99 reports it).","say_it":"The encounter is recorded before the reply, and it deliberately never touches the fields a rep owns.","next":["Upsert Scan Ledger"]},{"step":20,"name":"Upsert Scan Ledger","type":"Data Table upsert","what":"Upserts oak_deliveries on scan_id with status 'accepted', the provisional classification and score, policy_version, identity fields, notes_hash, created_at, and a first raw_json containing the normalized scanner input plus the provisional decision (classification, persona, size band, score, breakdown, rule summary, reasons, trace), crm_context, company_enrichment and company_evidence.","why":"'accepted' is what makes a mid-pipeline failure retryable (Duplicate Delivery? only blocks 'complete'), and the row exists before the scanner hears back.","in":"$('Build Alert Package').item.json and $('Normalize Scan').first().json.","out":"The upserted ledger row.","decides":null,"code":"filters: scan_id = {{ $('Build Alert Package').item.json.scan_id }}\nstatus: accepted","branches":[],"on_failure":"No error settings: a failure stops the run before the reply. On a retry of the same scan_id this overwrites the row, including created_at.","say_it":"Every scan is in the ledger as 'accepted' before the scanner gets its answer, which is what makes a crashed scan recoverable.","next":["Build Accepted Response"]},{"step":21,"name":"Build Accepted Response","type":"Code","what":"Builds the 202 body: accepted true, status 'accepted', scan_id, event_id, a note that the decision fields are provisional and that the stored decision in oak_deliveries is authoritative, then provisional_classification, provisional_persona, provisional_score, provisional_score_breakdown, provisional_rule_summary, provisional_routing, company_size_band, repeat_scan, scan_count, notification_mode, injection_suspected, enrichment_cache_hit, needs_company_enrichment, policy_version, alert_preview, and the downstream step list.","why":"Naming every decision field 'provisional_' is how the API is honest that enrichment, AI and the final gate may still move the tier.","in":"$('Build Alert Package').first().json","out":"The 202 response body.","decides":null,"code":"note:'Decision fields below are provisional. Enrichment, AI synthesis and the final deterministic gate run after this reply; the stored decision in oak_deliveries is authoritative.'","branches":[],"on_failure":"No settings; it only reads one item.","say_it":"The reply is explicitly provisional, and it tells the caller where the authoritative answer will be.","next":["Respond Accepted"]},{"step":22,"name":"Respond Accepted","type":"Respond to Webhook","what":"Replies HTTP 202 with the accepted body, about two seconds after the scan arrived. Unlike the other Respond nodes it has an output, so the workflow keeps running into the expensive work.","why":"This is the whole 'answer first, think later' design: the rep is not kept waiting on web fetches, HubSpot and an LLM.","in":"$json from Build Accepted Response.","out":"The HTTP response, and the same item passed on to Prepare CRM Handoff.","decides":null,"code":"responseCode: 202  responseBody: {{ $json }}","branches":[],"on_failure":"No settings. Everything after this node happens after the scanner already has its answer, so later failures never reach the scanner; they reach 99 and the ledger.","say_it":"The 202 goes out here and the workflow keeps going, so the booth never waits for enrichment or AI.","next":["Prepare CRM Handoff"]}]},{"name":"4. Buy intelligence, then settle the tier","purpose":"Every classified scan is enriched. The gates here pick which calls cost money, not which leads get looked at; the final gate settles the tier.","nodes":[{"step":23,"name":"Prepare CRM Handoff","type":"Code","what":"Takes the Build Alert Package item and removes the policy object, passing everything else on.","why":"The policy document would otherwise be copied through every sub-workflow hop and into stored payloads; 04 and 05 load the policy themselves, and the final gate reloads it with Load Gate Policy.","in":"$('Build Alert Package').first().json","out":"The lead payload without policy.","decides":null,"code":"const {policy,...payload}=p;\nreturn[{json:payload}];","branches":[],"on_failure":"No settings; trivial code.","say_it":"The policy is stripped before the sub-workflow hops so it is not copied through every call and every stored row.","next":["Needs Intelligence?"]},{"step":24,"name":"Needs Intelligence?","type":"IF","what":"IF intelligence_required is true (boolean, strict). Evaluate ICP Policy sets it true for all five classifications, so every classified scan takes the true branch.","why":"Competitor detection must not depend on lead fit: even an out_of_scope scan gets the CRM read and the free homepage read. The false branch is a safety net for a scan that arrives unclassified; no current classification takes it.","in":"intelligence_required","out":"The item on the true or false output.","decides":"Whether to buy CRM context and enrichment (always yes today).","code":"leftValue: {{ $json.intelligence_required }}  operator: boolean true","branches":[{"label":"true","goes_to":"Read CRM Context","meaning":"Every classified scan: read HubSpot, then enrich."},{"label":"false","goes_to":"Can Sync Contact?","meaning":"Safety net only; skips 02A, 04, 05 and the gate and goes straight to the email gate."}],"on_failure":"An IF on a boolean does not realistically fail.","say_it":"Every lead gets looked at; the gates only decide what costs money.","next":["Read CRM Context","Can Sync Contact?"]},{"step":25,"name":"Read CRM Context","type":"Execute Sub-workflow (02A)","what":"Calls 02A 'Oak GTM - 02A CRM Context [sub-flow]' (xnl1bav7McaQIwXC) with the whole item and waits for it. 02A reads the HubSpot portal, company by domain, contact by email and open deals, and returns the payload with crm_context filled in (relationship, owner, open deals, contact URL).","why":"The CRM is the record of truth: a HubSpot headcount outranks every other source in 04, and the owner and open deal shape the AI's opening question, so the CRM must be read before either runs.","in":"The payload from Prepare CRM Handoff.","out":"The payload with crm_context (lookup_status 'complete').","decides":null,"code":"workflowId: xnl1bav7McaQIwXC  waitForSubWorkflow: true","branches":[],"on_failure":"No contin
